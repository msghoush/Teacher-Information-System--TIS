knowledge_impact: yes
summary: "Cumulative origin/master-to-dev Students/Talent delivery through M11 remains preserved (see prior entries' history in docs/CHANGE_HISTORY.md for the full M1-M11 record). M12 is an integrated QA/regression/release-readiness verification pass across M1-M11: Student ID, Learning Style, Al-Andalus Section display, Evaluation Progress, Student roster backend/frontend, Talent frontend cleanup, Results & Analytics, permissions, tenant isolation, historical/frozen attribution, and privacy/suppression were all re-verified end to end with no new functional/UX regression found. One stale test fixture was corrected: tests/test_permission_registry_matrix.py still pinned routers/students_ui.py as a recorded consumer of talent_educator_inputs.view after M8 (commit b7c4791) intentionally made that route pass include_educator_inputs=False unconditionally instead of gating on the permission - the permission remains active-enforced via its two real consumers (routers/talent_educator_inputs.py, routers/talent_learner_profiles.py); this is a test-fixture-only correction matching already-shipped, already-documented M8 behavior, not a product/permission/architecture change. A separate, non-code finding was identified and intentionally NOT fixed in this task: the PostgreSQL index name uq_student_external_identifiers_tis_student_number_active_student (models.py, db_migrations.py migration 20260922_002_student_tis_number_identifier_integrity, introduced in Student M1 commit e98214f) is 65 characters, exceeding PostgreSQL's 63-character NAMEDATALEN identifier limit; PostgreSQL silently truncates it on CREATE UNIQUE INDEX, which breaks this migration's own idempotency check (_index_exists() compares against the full untruncated name and will never match the truncated stored name), risking a DuplicateTable failure if this migration's ledger is ever re-applied against a real PostgreSQL deployment. SQLite (tis.db) is unaffected - no length limit - which is why this was invisible to all prior SQLite-backed test runs. Fixing this requires renaming the index (touching models.py/db_migrations.py schema-defining code) and an Owner/architecture decision on rename-and-release coordination, both explicitly out of this verification-only task's boundary; it is reported as an unresolved pre-PostgreSQL-deploy risk, not fixed here. No schema, migration, or product behavior change was made by M12 itself."
