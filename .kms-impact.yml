knowledge_impact: yes
summary: "Per direct Owner instruction, ADR 0039 records two Talent & Potential policy changes: (1) Grade is no longer a Start Assessment eligibility gate - amends ADR 0035 condition 4 so a Student is assessable once the Program's saved build has at least one Competency with one KPI/criterion and one Level, regardless of the Student's specific Grade; Grade remains display/historical context only, the rest of ADR 0035 is unchanged. (2) The user-facing authoring/assessment hierarchy is relabeled Competency -> KPI -> Level ('Assessment Criteria' retired as normal-user-facing text); internal schema/API rubric names may remain unchanged. This does NOT resolve whether the separate, pre-existing numeric TalentKpiConfiguration feature needs its own rename to avoid a two-different-things-called-KPI collision - that is explicitly flagged as a distinct follow-up decision, not silently resolved. Program readiness becomes Competency+KPI+Level+Save=Ready with no separate Finish-Setup/Activate step in the normal flow; Competency delete becomes a single subtree action while historical completed Assessment evidence remains immutable. This is a governance-authorization record only, not a completion record; implementation is tracked separately. Implementation (this pass): talent_student_assessment_service.py's _newest_assessable_framework now prefers Grade-specific assessable content but falls back to the Program's full saved build (any Grade) instead of raising assessment_tool_unavailable when none exists for the Student's specific Grade; the matching client-side fallback was added to the Assessment editor's own competency filter in talent-operations.js so an assessment that the backend now allows never renders with zero Competencies. static/js/talent-program-workspace.js's readiness computation now requires only Competency+KPI(rubric)+Level (dropped the per-level achievement-description-completeness and Evaluation-Period-scheduled requirements) and states the exact single missing requirement in plain language; the Finish Setup/Program-Framework-activation action remains available but is no longer required for or tied to the Ready banner, consistent with ADR 0039's 'internal lifecycle stays behind the scenes' instruction. User-facing 'Rubric'/'Assessment Criteria' labels in the Program-summary and Competency-build UI are relabeled 'KPI'; the separate, pre-existing numeric TalentKpiConfiguration feature (its own remove-kpi action/label) was left untouched and unrenamed, so a real, still-unresolved two-things-called-KPI collision exists in the UI - flagged for a follow-up Owner naming decision, not resolved here. talent_program_service.upsert_rubric's name parameter is now optional; when omitted it auto-derives '<Competency label> KPI' from the owning competency (a legacy Framework-wide rubric with no owning competency still requires an explicit name, since there is nothing to derive from). remove_framework_competency (Delete Competency) now cascades its owned Rubric+Levels (already did) and its achievement Descriptors (new) as one subtree action instead of blocking on their presence; it still blocks with an exact reason if the Competency has numeric KPI weighting or Program Criteria/candidate rules referencing it, since deleting those is a separate governed decision this ADR does not authorize. templates/base.html no longer suppresses the visible 'Talent & Potential' sidebar text when the Ghars brand logo renders; the logo now renders at the same size as sibling navigation icons (static/css/app-shell.css's oversized .sidebar-link--brand/.sidebar-brand-logo rules replaced with icon-sized .sidebar-brand-symbol) so the row no longer exceeds neighboring row height. The existing static/img/talent-ghars-logo.svg asset was inspected and confirmed to be one dense, unlabeled bilingual-wordmark path with no separable icon-only symbol that can be safely extracted via a text edit; per the Owner's own instruction not to invent a new visual identity, the fix renders the existing asset at icon size rather than fabricating a new mark - a true hand-extracted icon-only Ghars symbol remains a follow-up design task, not something this pass could safely perform. ui_shell.py adds a 'Students' entry as the first child of the Talent & Potential nav tree, gated by the existing students.view permission (never granted implicitly by a Talent permission); the existing separate top-level Students item is preserved. No schema migration was required anywhere in this pass. Zero new test regressions were introduced across the full Talent Python and Node suites, confirmed by direct before/after comparison (stashing each changed file and re-running the exact same suites) rather than assumption; a set of pre-existing failures (evaluation-plans/reviews nav-array test-vs-code drift, an unimplemented remove-member-versioned action, an unrelated fixture-name mismatch, and others) were independently confirmed present and identical both before and after every change in this pass, and are therefore reported as pre-existing baseline gaps, not fixed and not newly introduced."
