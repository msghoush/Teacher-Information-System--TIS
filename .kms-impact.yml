summary: "Phase 1 (this task): split the combined Role Permissions editor into two explicit modes on the same `/system-configuration/role-permissions` GET/POST route -- `?mode=packages` (Role Packages: the standard/global role editor with no SchoolGroup selector, no tenant name, and no Platform Owner tenant context anywhere) and `?mode=overrides` (School Overrides: the only place a SchoolGroup appears, always labeled as an explicit management target and never as Platform Owner actor/session context). Both modes reuse the existing, unmodified `role_permission_service.py` resolver/writer (built-in role default -> global RolePermission -> tenant RolePermission, ADR 0040 unchanged) -- no second resolver was created. Added a new read-only `role_permission_service.build_school_override_payload` that reports Standard Role Package / this school's own override / Effective per permission key for School Overrides mode, and confirmed by test that viewing it never writes a tenant RolePermission row. A 'Reset to standard' control is UI-only (resets the checkbox to the Standard value before Save); the existing `apply_role_permission_overrides` diff-against-baseline write path already turns that into a clean row delete, so no new backend removal semantics were invented. `main.py`'s POST route now takes a `mode` form field (packages/overrides) instead of the old `scope_type`+scope dropdown; a tenant actor is still hard-locked to their own authorized SchoolGroup on both GET (silently ignores a foreign school_group_id query param) and POST (redirects to /dashboard on a foreign school_group_id, matching the pre-existing cross-tenant boundary). This closes the real incident described in docs/PROJECT_STATE.md's 'Dashboard Tab/Panel Permission-Gate Closure' and 'Role Permissions UI' entries: the old single 'Permission Scope: Global defaults / Selected school' dropdown made a tenant Deny override visually indistinguishable from the Global default, and the Platform Owner UI appeared to belong to whichever school was selected. Also carries forward the already-uncommitted diagnostic CLI fix from commit 7b2052d (scripts/diagnose_user_permissions.py: sys.path bootstrap for direct invocation without PYTHONPATH=., and canonical identity resolution via auth.resolve_login_user instead of a raw case-sensitive models.User.email== lookup), re-verified working in this task. No schema, migration, new permission key, or precedence-rule change. tis.db was not modified (SHA-256 hash verified identical before and after this task)."
