knowledge_impact: yes
summary: "Owner corrective pass on top of pushed commits f9c4868/d6c5a06: the initial ADR 0039 implementation only partly removed Grade as a gate (Start Assessment stopped hard-blocking via a framework-content fallback, but three other surfaces still required the Student's Placement Grade to be a member of the Program's own eligible_grade_levels configuration). Fixed a real citation error in ADR 0039 itself along the way: the actual Grade-Placement gate is ADR 0035 condition 3 ('the Placement Grade is included in the Program's enabled Academic Year configuration'), not condition 4 (framework content) as ADR 0039 originally said - this explains why the first pass targeted the wrong function. This pass: (1) talent_student_assessment_service.py's _current_eligible_placement (renamed _current_placement_for_assessment) no longer filters the Student's Placement by eligible_grade_levels - only tenant scope, Program Academic-Year enablement, and a genuinely current effective Placement are required; Grade remains captured on the resulting population member/Assessment as historical/context data only. (2) The Student Assessments list route (GET /api/talent/assessment-cycles/{id}/eligible-students) now calls a new current_placements_for_assessment (talent_assessment_cycle_service.py) instead of derive_eligible_population, returning every current, validly placed Student in authorized tenant/Branch/Academic-Year scope with no Grade filter; derive_eligible_population itself is UNCHANGED and remains Grade-filtered for its own legacy/frozen-population callers (Cycle open/preview/ADR 0033 reconciliation) - those are historical population mechanics, deliberately not rewritten, per the explicit instruction not to blindly rewrite M4 population semantics still needed elsewhere. (3) static/js/talent-program-workspace.js's readiness (setupComplete) no longer includes basicsComplete (Program/Academic-Year eligible-Grade configuration) in its gate - Ready is exactly the assessment build itself (Competency+KPI+Level, saved); Grade configuration remains available for context/configuration but never blocks Ready. New regression tests prove: a Program with Competency+KPI+Level and zero eligible Grades selected shows Ready; a 7-Student fixture (6 Grade 3, 1 Grade 4) against a Program configured for Grade '1' only shows all 7 in the live roster and both a Grade 3 and a Grade 4 Student can Start Assessment; the legacy M4 preview path remains correctly Grade-filtered and unaffected; cross-tenant scope remains enforced (a foreign-tenant roster returns empty). No schema migration was required. Zero new test regressions were introduced, confirmed by direct before/after comparison (stashing each changed file and re-running the exact same suites) rather than assumption; three pre-existing failures in tests/test_talent_assessment_cycle_frozen_population.py, already present on the just-pushed d6c5a06 commit before this corrective pass touched anything, were confirmed present and identical both before and after this pass and are reported as pre-existing baseline gaps, not fixed and not newly introduced by this change."
