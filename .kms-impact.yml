knowledge_impact: yes
summary: "THIS TASK (Deployment Acceptance Batch 1 - data correctness, scope integrity, Student deletion and loading, on top of cd3a1be; Web Service only, not deployed; no schema, migration, permission or tis.db change). (1) Root cause of the Overview 'Students participating = 63 while 9 Students exist': the headline was the frozen-membership row count (one TalentAssessmentCyclePopulationMember per Student per open/closed Cycle/Program) labelled as Students, and the population queries never checked the Student still exists. Fix: talent_current_students.current_student_exists is composed into population_query, frozen_membership_query, the Evaluation Progress Branch reads and list_assessments; the Overview adds distinct_students (existing distinct-Student authority, class P2, existing student_drill_population/count/distinct_student coordinate, ADR 0044 Batch 1 amendment) and an authorized branch_id; labels state their grain (Students participating = distinct current Students, Program participations, Assessments completed, Talented results). (2) Student deletion: exhaustive FK audit found ten Student-owned tables, all already removed by force_delete_student_history; the list is now STUDENT_OWNED_MODELS locked to ORM metadata by test; permission model unchanged (normal and bulk Delete stay blocked by history); the ObjectDeletedError failure was a test defect. (3) Global Branch context: the sidebar Branch only set the session scope and Talent ignored it; talent_ui renders the validated active Branch as tp-config.branch, talent.js reconcileBranchScope makes it the default scope, clears a stale Branch/Grade/Section from another Branch's URL and honors explicit All Branches; Overview, Program Results (/program-portfolio previously ignored branch_id) and the eligible-students roster accept an authorized branch_id; backend authorization unchanged. (4) Loading/performance: measured row-proportional N+1 (assessments list 982 statements for 20 rows, drill 136, classification 74, branch comparison 84, evaluation plans 140, access context 31-34) fixed with opt-in request-scoped talent_read_batch memoization, set-based priming and a per-request permission checker; the Assessments page requests only its Year/Program; /programs/summaries HTTP 500 fixed; Talent assets are content-hash versioned; an inline 15 s watchdog ends a still-untouched server loader in an explicit error; Render capacity not shown to be implicated (production cannot be measured here). Tests: tests/test_talent_batch1_data_scope.py, tests/test_student_delete_completeness_batch1.py, tests/talent_branch_scope_and_metrics.test.cjs, additions to tests/test_talent_ui.py, shared tests/talent_test_students.py; stale pins updated deliberately (fixtures now create real Students; drill ceiling 12 -> 18 (fixed family of 17); script regex accepts ?v=). KMS: PROJECT_STATE, CHANGE_HISTORY, AI_PROJECT_CONTEXT (duplicate Acceptance C heading removed), TIS_MASTER_CONTEXT, TIS_MODULE_MAP, USER_AND_SYSTEM_FLOWS, ADR 0044. CLOSURE (2026-09-25, same task boundary, supersedes the Batch 1 default-only Branch wording): the global Branch is a HARD Talent scope. talent_branch_scope.py computes the ceiling server-side from the request user (intersection of actor authorization and active global scope) and composes it into the M10 access context and every Talent router visible-Branch resolution (organization analytics, analytics, results analytics incl. Learning Style, Evaluation Progress, Assessments, Cycle roster/population, learner profile, legacy review/identification/educator lists, selector option lists); an explicit other Branch is rejected and an omitted Branch resolves to the ceiling. Added an explicit global All Branches state (branch_scope=all marker cookie via POST /scope/branch branch_id=all, user.scope_all_branches, option shown only on /talent pages; other modules unchanged) because no organization-wide global state existed. talent.js treats config.branch as a ceiling (no All Branches or other Branch offered or sent, stale URL clamped). Student deletion, inactive-Student and Talented-KPI semantics unchanged; no schema, migration, permission or tis.db change. Tests: tests/test_talent_branch_hard_scope.py, Node B3/B4/B6/B6b, updated Batch 1 fixtures. KMS: same seven docs, with dated correction notes. AGENT 2/3 CUMULATIVE ADDITION (2026-09-25): request-backed Student Assessment filters and canonical summaries; Agent 3 owner privacy amendment protects Classification-filtered Learning Style cohorts while preserving individually authorized operational rows; current reassessment provenance; bounded repeatable-snapshot aggregate dashboard with P2/P3/P4 provider rules, six selected comparison groups, Program-bound rubric indicators, no cross-framework result pooling; six-section aggregate UI, executive Overview charts, Program cards, shared accessible privacy-safe chart modes and surface-specific bundles; adversarial backend/frontend regression. The four previously omitted cumulative KMS declarations remain restored for origin/master...dev. AGENT 3 RECOVERY COMPLETION (2026-09-25): audited and completed the interrupted local Agent 3 worktree; removed re-introduced generic privacy copy (M18a), fixed the inert Program summary Finish Setup control, replaced emoji icons, added the Talent visual-system stylesheet layer, Program grade chips and backend/Node regression (Overview agreement, statement bound, route-level protected Learning Style, exact roster rows, chart-mode matrix, Program Status absence). Visual results structurally verified only. No schema/migration, tis.db, deployment, master merge or release PR change. SECURITY/QA CLOSURE (2026-09-25): the dashboard route no longer echoes str(ValueError); only the bounded DashboardError text is returned and any other ValueError yields the fixed 'Invalid analytics filter.' (400, invalid_filter); the ADR 0031 Talent guard is tightened to an AST allow-list confining Learning Style references in routers/talent_assessment_cycles.py to cycles_eligible_students and confining talent_learning_style_privacy imports to that router and talent_dashboard_service, with a negative self-test; one stale tenant-isolation test updated for the eight-category roster distribution. No schema, migration, tis.db, permission or analytics-semantics change. DEPLOYMENT HOTFIX (2026-09-25): requirements.txt now also declares psycopg[binary] (psycopg v3) because the production DATABASE_URL selects the postgresql+psycopg dialect and pre-deploy run_migrations failed with ModuleNotFoundError; psycopg2-binary kept; guarded by tests/test_deployment_dependencies.py; CHANGE_HISTORY note; no code, schema, env or tis.db change. PRODUCTION FOLLOW-UP PART 1 (2026-09-25): (A) sidebar Branch selector lists real Branches only; the Talent All Branches entry, branch_scope=all cookie and user.scope_all_branches are removed (old cookie ignored); organization-authorized actors choose All Branches or any authorized Branch in the Talent page-level filter with the sidebar Branch as default, Branch-limited actors stay confined (tp-config.branchLocked); ADR 0044 dated owner amendment supersedes the Batch 1 hard-ceiling wording for organization-authorized actors only. (B) Start Assessment root cause: stable safe 400 codes (chiefly assessment_tool_unavailable) collapsed into generic copy and a top-of-page banner; curated per-code copy shown inline, backend flow proven end to end. (C) Classification Unavailable diagnosed as the approved per-band cohort floor (minimum cohort 5, P4, complementary suppression); no privacy rule changed, one uniform value-free explanatory sentence added. No schema, migration, permission or tis.db change; Web Service only. PRODUCTION FOLLOW-UP PART 2 (2026-09-25): (D) chart-type selector switches only distinct visualization types (Bar/Doughnut for full public partitions of at most eight categories, Trend/Bar for series, Bar only for Learning Style, Rubric levels and comparisons; duplicate Percentage and redundant Pie removed; Overview defaults to Doughnut with one reduced-motion-aware entrance animation); (E) Results & Analytics filters refresh in the background (AbortController, newest-token-wins, held region height, restored scroll and focus, inline retryable error) instead of replacing the page root, chart-type change is client-only; (F) one bottom Selected Comparisons section with selector, six-group limit and results; (G) Progress Over Time kept as a per-Program longitudinal trend over the existing ADR 0027 API with honest gaps, linked from Results; (I) inline SVG chevrons replace raw arrows. Presentation only; no schema, migration, permission, analytics-semantics, privacy or tis.db change; Web Service only; Node stub harness verification, no browser. FINAL-CLOSURE PART A (2026-09-25): Start Assessment must actually work. Root cause: the Grade-agnostic Student Assessments roster offered an enabled Start for Students whose Grade has no saved criteria in the Program, while Start is Grade-aligned (ADR 0039 amendment) and failed with assessment_tool_unavailable; Part 1 had only curated the copy. Fix: the roster now returns per-row can_start / start_block_code / start_block_reason from the same predicate the start route enforces (roster_start_states over _newest_assessable_framework plus the duplicate guard); the browser renders Start only when can_start is true, otherwise a bounded reason (Program setup link only with talent_programs.manage); POST /api/talent/assessments verifies an optional echoed Program/Academic Year against the Cycle (409 context_mismatch) and a stale cycle_id lists no roster. Tenant, Branch, permission and evidence rules unchanged. Tests: tests/test_talent_start_assessment_eligibility.py, Node additions in talent_operations.test.cjs. KMS: PROJECT_STATE, CHANGE_HISTORY, ADR 0044 amendment, USER_AND_SYSTEM_FLOWS, TIS_MODULE_MAP. No schema, migration, permission or tis.db change; Web Service only; Part B (central configuration authority) not included at that point. FINAL-CLOSURE PART B (2026-09-25): central organization Talent configuration authority. Owner clarification: no Branch copy/clone/enablement model; Programs, Frameworks/Rubrics, Competencies/KPI, annual Program configuration, Evaluation Plans/Periods and Assessment Cycle definitions stay SchoolGroup-level shared configuration governed once by the organization Administrator; Branch state stays Students, placements, Cycle population evidence, Assessments, results and analytics (TalentProgram has no Branch ownership). Found: the default role matrix is code-defined (only Administrator holds talent_* keys; Editor/User/Limited hold none) but Program/Framework/Competency/Rubric/KPI/annual-configuration and Cycle create/edit routes were gated by the .manage permission alone, so a Branch-scoped Administrator could author organization-wide configuration (an old test pinned it). Change: every configuration mutation route now requires its existing semantic permission AND organization/global access scope, enforced structurally in each router's _authorize (CONFIG_MUTATION_KEYS, CYCLE_CONFIG_KEYS, PLAN_CONFIG_KEYS; 403 organization_authority_required); reads, shared-configuration use and Assessment/results permissions unchanged; talent_ui withholds every configuration capability from Branch scope and the Programs/Evaluation Plan views state 'Shared by all Branches'. Stored custom grants are not revoked (organization-scoped custom grant holders keep authority; residual owner decision). Added read-only scripts/audit_talent_program_duplicates_readonly.py (no production data audited). Tests: tests/test_talent_central_configuration_authority.py, tests/test_audit_talent_program_duplicates_readonly.py, additions to test_talent_ui.py and talent_program_workspace.test.cjs; old Branch-author test replaced deliberately. KMS: the same seven docs with dated Part B sections/amendment (older wording preserved with supersession pointers). No schema, migration, new permission key or tis.db change; Web Service only. FINAL PRE-RELEASE VERIFICATION PASS (2026-09-25, code side): the dangerous-permission-pattern test (failing unnoticed since a94013e, also for the Batch 1 talent_request_permissions memo) now classifies its three reviewed-safe hits with justification (no pattern weakened, no behavior change); Start Assessment derived-Cycle titles are bounded so a can_start row cannot fail on a maximum-length Evaluation title; talent_programs._authorize gates on any() configuration key like Evaluation Plans; regression tests added; CHANGE_HISTORY note. No schema, migration, permission key or tis.db change; Web Service only. PROGRESS OVER TIME COMPARABILITY CLOSURE (2026-09-25): the Progress Over Time trend broke only at non-visible points, so visible Periods across a non-comparable adjacent pair (framework_changed) were joined by a continuous line; talent.js now passes each Period id and the existing backend comparisons list to talent-charts.js series(), which connects a pair only when its record is comparable (missing/unknown record: no connection; frontend never derives comparability), keeps every visible Period value, dot and table row, adds a value-free break marker and legend note, and keeps suppressed/no-data gaps and the comparison-less Results completion-by-period trend unchanged. Presentation only; no analytics, privacy, permission, schema, migration or tis.db change; Web Service only; ADR 0044 dated clarification, CHANGE_HISTORY, PROJECT_STATE and AI_PROJECT_CONTEXT pointers; tests/talent_progress_comparability.test.cjs."
