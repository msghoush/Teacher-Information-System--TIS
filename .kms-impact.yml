knowledge_impact: no
summary: "P0 Talent roster correction from Owner browser/video evidence. The Draft Student Assessments UI now exposes the already-governed preview/open flow, but the backend preview and Open-cycle reconciliation still derived eligibility only at the Cycle's configured population_effective_at. In the reproduced data this made a 2026-08-30 Student-list date act as a cutoff, so Students with valid current Academic Placements beginning after that date were omitted even though the UI described the preview as live and ADR 0033 requires newly eligible Students to be additively assessable while the Cycle remains Open. The service now keeps the original M4 opening snapshot behavior at the configured population_effective_at, while Draft preview and ADR 0033 Open-roster reconciliation derive effective-dated Placement eligibility at their current preview/synchronization instant. Existing population members and evidence remain immutable; reconciliation remains additive-only, organization-governed, revisioned, fingerprinted, and audited. The Student Assessments explanatory/confirmation copy was corrected so it no longer claims Opening permanently freezes the entire roster; it now accurately states that Opening records the initial roster and newly eligible Students may be added while Open. No schema, migration, permission, tenant-isolation, lifecycle, analytics, billing, or new API contract change."
affected_areas:
  - student-assessments-live-draft-preview
  - open-cycle-additive-roster-reconciliation
kms_files_updated:
no_impact_reason: "Implementation correction to match already-accepted ADR 0033. The accepted ADR explicitly requires post-Open qualifying Placements to become assessable immediately and defines synchronization at an explicit synchronization timestamp. This change removes a stale historical-cutoff implementation bug and aligns UI wording with that existing governed contract; it does not introduce a new product or architecture decision."
