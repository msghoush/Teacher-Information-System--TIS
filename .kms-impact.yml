knowledge_impact: yes
summary: "M14 (Students + Talent & Potential): owner-directed correction milestone implementing two corrections identified in a prior read-only Post-M13 Correction Review. (1) Learning Style is ONE categorical selection per Student, extended from four to eight values (Visual, Auditory, Read/Write, Kinesthetic, Verbal, Non-verbal, Quantitative, Spatial) - the four added values were previously, mistakenly, modeled as an independent four-dimension percentage profile (learning_style_verbal_percentage/non_verbal_percentage/quantitative_percentage/spatial_percentage, ADR 0042/M1-M3). Verified against actual code that, contrary to ADR 0042's own stated M1 scope boundary, the M2/M3 delivery had already built a full create/update/GET API and a real Student create/edit frontend for the four percentages, while the ORIGINAL single-select categorical field from ADR 0031 had never received any create/edit frontend selector at all - templates/_learning_style.html's learning_style_field/learning_style_badge macros existed but were unused dead code. Student create/edit now shows one Learning Style selector (eight values plus Not assigned); the Student profile shows the one selected value instead of four percentage bars; Talent Student context reads the current categorical value directly (zero effect on rubric/Assessment/Overall Result/Evaluation Progress/classification/Candidate-Identification, verified unchanged). (2) 'Percentage' means population/aggregate distribution, never a per-Student dimension percentage - the four learning_style_*_percentage columns are now operationally deprecated: student_academic_service.py's create_student/update_student keep the columns/validators only so a pre-existing stored value is never silently rewritten, but routers/students.py and routers/students_ui.py no longer accept them as create/update input at all (silently ignored, never a validation error); existing stored values are preserved completely untouched (no backfill, no conversion, no clearing) since deployed-data occupancy could not be safely verified (local tis.db has no students table at all). student_learning_style_analytics.py (the existing privacy-safe categorical count/percentage/distribution engine used by templates/students.html) is extended, not parallel-built, to cover all eight categorical values plus an Unassigned bucket, denominator always including Unassigned Students, reusing the identical Branch/Organization scope and Talent privacy/suppression contract ADR 0031 already required. The M4/M10 talent_evaluation_progress_service.py 'learning_style' Branch-comparison metric, which averaged the four now-deprecated columns, is removed from APPROVED_BRANCH_METRICS (six metrics remain, not seven); a request for it now receives the same invalid_filter/400 response as any other unrecognized metric. static/js/talent.js and templates/talent/workspace.html no longer offer the Learning Style dimension selector for that removed metric. One forward-only migration (20260923_002_student_learning_style_eight_values) widens ck_students_learning_style from four to eight values on PostgreSQL (DROP CONSTRAINT IF EXISTS + ADD CONSTRAINT ... NOT VALID + VALIDATE CONSTRAINT, mirroring the exact pattern already used elsewhere in db_migrations.py, e.g. _m8b9_demo_operations, for widening a CHECK constraint under the same name); SQLite continues to rely on the service-layer guard for an already-migrated database (same convention as the original _student_learning_style_v1 migration), and a fresh SQLite database gets the widened constraint directly from models.py's current CheckConstraint. No column added or dropped, no row rewritten; tis.db verified byte-identical via SHA-256 before and after this task. student_roster_service.py's column contract was inspected and does not include Learning Style or the four percentage columns at all, so roster scope is untouched, per its explicit stated boundary. ADR 0031 and ADR 0042 are amended (not rewritten) with new dated M14 sections recording the corrected model, following the exact amend-not-rewrite convention ADR 0031 already used when ADR 0042 amended it; ADR 0044 is amended recording the removed Branch-comparison metric. docs/PROJECT_STATE.md, docs/TIS_MASTER_CONTEXT.md, docs/AI_PROJECT_CONTEXT.md, docs/engineering/TIS_MODULE_MAP.md, and docs/engineering/USER_AND_SYSTEM_FLOWS.md each received a new M14 section plus targeted corrections to specific stale current-state sentences left over from the M7/M10 four-percentage model (matching the exact precedent M13 used for stale M7 roster wording) - no historical dated entry was rewritten as if the mistaken implementation never happened. docs/releases/2026-09-23-students-talent-m1-m13-release-handoff.md received a superseded-in-part pointer at the top, with its historical body left unmodified. docs/CHANGE_HISTORY.md received a new dated M14 entry (not a rewrite of the M13 entry or any earlier entry). Focused and adjacent regression suites re-run (see task report for exact counts): tests/test_student_learning_style_v1.py, tests/test_student_learning_style_four_dimension_api.py, tests/test_student_learning_style_profile_foundation.py, tests/test_students_ui.py, tests/test_student_academic_foundation.py, tests/test_student_roster_import_export.py, tests/test_student_managed_number_service.py, tests/test_student_tis_number_identifier_foundation.py, tests/test_permission_registry_matrix.py, tests/test_talent_organization_student_drill.py, tests/test_talent_evaluation_progress.py - 3 pre-existing failures reproduced and stash-verified as unrelated to this task and already failing on unmodified dev HEAD (test_force_delete_student_history_removes_protected_academic_history, test_query_family_is_bounded_and_not_row_proportional, and test_html_students_page_shows_one_panel_level_protected_message_when_every_category_is_suppressed - the last one is a privacy-suppression-convergence text-count assertion that already failed identically on unmodified dev before any M14 code changed, i.e. pre-existing/stale even though it lives in a file this task otherwise edited); zero other failures. M15 (Student deletion/count correction, roster redesign), M16 (Student action layout, Talent whole-module performance), M17 (assessment classification), and M18 (Results & Analytics rebuild, further privacy-copy cleanup) work was explicitly out of scope and was not touched. Does not itself authorize, perform, or claim any deployment; Web Service and the separate tis-timetable-workflow revision are unaffected (no timetable-domain code touched)."
