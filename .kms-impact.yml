summary: "Cumulative origin/master-to-dev Students/Talent delivery through M12 remains preserved (see prior entries' history in docs/CHANGE_HISTORY.md for the full M1-M12 record). M12.1 (this task) is a bounded migration-safety correction: PostgreSQL managed Student-number index identifier remediation. Fixed the PostgreSQL identifier-length defect M12 documented but deliberately did not fix: the M1 active-per-Student partial unique index (uq_student_external_identifiers_tis_student_number_active_student, 65 characters) exceeded PostgreSQL's 63-character NAMEDATALEN limit and was silently truncated on CREATE UNIQUE INDEX, breaking the originating migration's own idempotency check - reproduced live against a real PostgreSQL test database (a rerun of the original migration function against the truncated physical index failed with psycopg2.errors.DuplicateTable, exactly as predicted). The canonical replacement name is uq_student_external_identifiers_tis_number_active_student (57 characters, verified). models.py and the original 20260922_002 migration now create this canonical name directly on any fresh database (SQLite or PostgreSQL) - the old 65-character name is never created anywhere anymore. A new forward migration (20260923_001_student_tis_number_index_identifier_length_remediation) renames an already-migrated PostgreSQL database's truncated physical index after verifying its actual catalog definition (columns, uniqueness, partial predicate) via SQLAlchemy's PostgreSQL inspector, is a no-op when the canonical name is already present, reuses the original migration's existing preflight-conflict checks to create the canonical index directly when neither name exists, and fails closed with a RuntimeError (never a silent guess) if either name has an unexpected definition or if both names exist simultaneously. The partial-unique-index semantic invariant (ADR 0043: UNIQUE (student_id) WHERE namespace = 'tis_student_number' AND status = 'active') and the separate global Student-number value-uniqueness index (uq_student_external_identifiers_tis_student_number_value, 56 characters, inspected and confirmed to have no length problem) are completely unchanged; no Student or StudentExternalIdentifier row was read, rewritten, merged, or deleted; the checked-in tis.db is verified byte-identical via SHA-256 before and after this task. This is a PostgreSQL-only physical schema-identifier correction - no product, API, or frontend change, no Student ID redesign, no roster/frontend change. ADR 0043 received a small M12.1 implementation-detail amendment note (physical index name only; the governance decision is unchanged), matching the ADR 0042/M5 precedent."
