summary: "Owner-directed Talent and Student workflow simplification. Talent Student Assessment uses the exact assessable Framework already referenced by the Evaluation without Program/Framework activation labels acting as additional start gates. Program Criteria configuration is removed from the normal Program setup UI and completed Student Assessments no longer expose a manual Check Program Criteria action. The sanctioned local Talent test dataset is expanded to 10 Arabic-named Students across Grades 3-5 with completed/in-progress assessment coverage for analytics UX review. Students management now adds separately permissioned single and atomic bulk permanent delete, limited to Students with no Academic Placement or Talent historical records; protected history is never cascaded away. Existing Review Candidate/Official Identification persistence and historical records remain intact."
