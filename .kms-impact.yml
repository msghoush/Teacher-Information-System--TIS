knowledge_impact: yes
summary: "Cumulative dev state includes M14 (Learning Style correction), M15 (roster round-trip + Talent visibility verification), M16 (Talent module performance + Student action layout, integrated), M17 (Automatic Assessment Classification + New Normal Talent Workflow), and this task's M18a: Current Talent Authority Alignment + Learning Style Cleanup + Privacy UX - a deliberately bounded FIRST HALF of the M18 milestone (the full Results & Analytics page rebuild is the separate, still-pending M18b). M18a GATE 1 (applicable-current-result authority, resolved from repository evidence before any code change, not invented): a TalentStudentAssessment row governs a Student's current M17 classification exactly when status=='completed' AND is_current==True - re-verified directly as the pre-existing ADR 0036 reassessment authority already consumed by talent_analytics_service._assessment_ids_subquery and the B9 Student Drill before this milestone; no new business rule was introduced. Part 1 (current Talent authority): talent_learner_profile_service.build_learner_profile's per-Assessment item and talent_org_student_drill.py's per-context row now additively expose the same backend classification/classification_score/is_talented fields already on routers/talent_assessments.py's _display_payload since M17, reusing talent_classification_service.assessment_classification directly (never duplicated, never sourced from TalentReviewCandidate/TalentOfficialIdentification). Building a NEW org/Branch AGGREGATE 'current Talented count' metric was evaluated and explicitly deferred to M18b (parent-session-confirmed scope decision, not a product ambiguity): talent_org_intelligence_contract.MetricCode is a frozen 14-value enum and ADR 0044 explicitly states no MetricCode extension; the existing Talent-adjacent aggregate metrics (CANDIDATE_COUNT/CANDIDATE_OF_ELIGIBLE/IDENTIFIED_COUNT/IDENTIFIED_OF_ELIGIBLE) are grounded in the legacy Review/Identification membership grains, not an M17-classification grain, so a privacy-safe Cell/Group aggregate for the new grain is new analytics infrastructure that belongs with the M18b rebuild. static/js/talent.js's candidate_of_eligible/identified_of_eligible labels (previously 'Talent share'/'Officially confirmed share', re-verified via direct grep as reading like current Talent-status shares though their underlying data is the legacy Review/Identification workflow) are relabeled 'Legacy review share'/'Legacy identification share' - metrics/data/permissions completely unchanged; TalentReviewCandidate/TalentOfficialIdentification rows/services/routers remain fully preserved, code-unchanged, legacy/history only (re-verified: tests/test_talent_learner_profile.py's existing Branch-isolation test now also asserts a legacy 'identified' Official Identification decision does NOT flip is_talented True on a single-level (fail-closed/unavailable) rubric, and a new dedicated five-level-rubric test proves Exceptional/is_talented=True is reached with zero Review Candidate/Official Identification rows at all). Part 2 (M14 Learning Style deprecation completed): independently re-verified (not assumed) that routers/students.py's _student_json and routers/students_ui.py's _student_view still serialized all four learning_style_*_percentage fields (including as literal null) in the current normal Student API/UI projection before this task - removed from both projections; stored DB columns and historical values completely untouched (no migration, no backfill, no tis.db change). Independently re-verified that talent_evaluation_progress_service.py's learning_style_branch_aggregate/_learning_style_values_by_branch/_LEARNING_STYLE_COLUMNS (left in place since M14 purely so the deprecated-column mean computation was not silently mutated) were genuinely unreachable from any current endpoint/service path - branch_comparison_metric (the only caller of any Branch-comparison metric, per routers/talent_evaluation_progress.py) has rejected 'learning_style' before ever reaching that code since M14 - and removed them outright along with their two stale direct-call tests (formerly tests/test_talent_evaluation_progress.py Section 8); the six-metric APPROVED_BRANCH_METRICS dispatcher itself is unchanged/unaffected. There is no current four-dimension Learning Style analytics authority anywhere in the repository after M18a; M14's own governing model (one categorical learning_style value; eight-category + Unassigned aggregate distribution; student_learning_style_analytics.py unaffected) is unchanged. Part 3 (privacy copy cleanup, presentation only): re-verified the exact literal-phrase occurrence count via a fresh case-insensitive repository grep (not trusted from any prior note) and removed every visible 'Protected for privacy' occurrence from Talent & Potential / Learning Style UI (static/js/talent.js in four places - the states/branchStateText maps, the Talent Map legend, the matrix cell explanation, plus the friendlyReason 'privacy_protected' copy and the rubric-distribution empty-state copy; static/js/talent-rubric-visual.js; static/js/talent-experience.js; templates/students.html in three places), replaced with context-appropriate neutral copy ('Unavailable', 'Not available for this view' [unchanged, already distinct], 'Distribution unavailable', 'This ... is not available for this selection') - never one mechanical replacement everywhere. The underlying primary/complementary suppression, minimum-population, anti-reconstruction, and tenant/Branch/organization privacy contract is completely unchanged (no privacy/suppression code was touched, only presentation strings); re-verified directly that no protected numeric value is present in any of the replacement copy and that the full existing Talent/Learning-Style privacy test suite (talent_analytics_privacy.py-backed tests, test_talent_privacy_reconstruction.py, test_talent_privacy_relationship_graph.py, test_talent_organization_*.py's suppression/complementary-suppression/branch/organization-privacy tests, test_student_learning_style_v1.py's suppression tests) passes identically to the exact pre-M18a baseline (029bce8b05b01a1b589453792a526ee77254ce9f) with zero new failures - confirmed via git-stash comparison, by exact test name, for the full `-k talent` suite (11 identical pre-existing Python failures; matching names) and the full `node --test tests/*.test.cjs` suite (18 identical pre-existing failures; matching names) plus every individually re-run touched-module test file (test_student_learning_style_four_dimension_api.py, test_talent_evaluation_progress.py, test_students_ui.py, test_student_learning_style_v1.py, test_student_learning_style_profile_foundation.py, test_student_delete_talent_visibility.py, test_talent_learner_profile.py, test_talent_organization_student_drill.py). No schema migration; tis.db byte-identical before/after this task (SHA-256 verified). M18b (the full Results & Analytics page rebuild, including any new org/Branch aggregate Talented-count analytics) remains explicitly out of scope and was not implemented here. M17 architecture decision (Part 1, resolved from repository evidence, not an arbitrary pick): ADR 0037's raw Overall Program Result is an arithmetic mean on each Talent Program's own 1..N rubric scale, where N is that Program's configured ordered rubric-level count - ADR 0037 itself frames 'a five-level Program' as one worked example only and expresses its normalized_percent projection with scale_max as a variable. Real configured Programs in this repository do not universally use five levels: the realistic local seed dataset (talent_local_test_data.py, built end-to-end through the real talent_program_service/talent_student_assessment_service contracts) configures a 4-level Program, a 3-level Program, and a second 4-level Program side by side. Mandating a system-wide five-level rubric (rejected Option A) would therefore have been a breaking change to real Program configurations, not a small formalization. M17 instead implements Option B (ADR 0037's 2026-09-23 Amendment): each Program's own configured 1..N rubric scale is preserved unchanged for the raw educational result, and one additional, separately governed deterministic linear projection (classification_score = 1 + (average - scale_min) * 4 / (scale_max - scale_min), exact Decimal arithmetic, half-up rounding to 2 decimals, computed from the new additive integer overall_program_result()['average_tenths'] field rather than re-deriving precision from a float) maps that raw average onto the fixed, owner-approved 1.00-5.00 classification scale: 1.00-1.99 Needs Improvement, 2.00-2.99 Developing, 3.00-3.74 Meets Expectations, 3.75-4.49 Advanced, 4.50-5.00 Exceptional; only Exceptional is Talented. A five-level Program's projection is the identity map, so it reuses the exact linear-rescale technique ADR 0037 already approves for normalized_percent, targeting [1.00,5.00] instead of a percentage - normalized_percent itself is unchanged and is never reused as classification input. A degenerate single-level rubric (scale_max<=scale_min) or an inconsistent-scale Assessment (already blocked at completion by ADR 0037) is not compatible with automatic classification and fails closed (available:false) rather than guessing. New talent_classification_service.py is the single classification authority (project_to_classification_scale, classify_score, is_talented, assessment_classification); classification is computed only for a status=='completed' Assessment and is never persisted (no schema migration) because it is a deterministic read projection over the exact same immutable Completed-Assessment inputs (Student Assessment, immutable Framework Version, Grade-applicable Framework Competencies, stored competency results, exact ordered rubric levels) ADR 0037 already establishes as stable for the raw Overall Program Result - re-verified directly: set_competency_result raises TalentStudentAssessmentError('immutable_assessment') against a Completed Assessment, and assessment_classification is idempotent across repeated calls on the same Completed Assessment. Normal workflow change: completing an Assessment no longer requires a manual Review Candidate/Official Identification step to make a Student Talented - Talented is now a direct backend consequence of automatic classification (Exceptional only), verified end-to-end via tests/test_talent_classification.py (TalentReviewCandidate/TalentOfficialIdentification row counts stay zero for a Program with no configured Review Candidate policy at all, yet is_talented is still correctly derived). Existing TalentReviewCandidate/TalentOfficialIdentification rows and their existing services (talent_review_candidate_service.py, talent_official_identification_service.py, their routers) are completely unchanged code-wise and are preserved as legacy/history: evaluate_review_candidate/mark_reviewed/record_decision still function exactly as before and their rows are never deleted or rewritten by a later automatic classification (verified directly: a legacy 'not_identified' Official Identification decision recorded against an Exceptional-classified Assessment leaves both the stored TalentReviewCandidate and TalentOfficialIdentification rows byte-identical while assessment_classification independently still reports is_talented=True) - they simply no longer govern current Talented state for the new normal workflow. API: routers/talent_assessments.py and routers/talent_review_candidates.py additively expose backend-computed classification/classification_score/is_talented fields (assessments router) and classification/is_talented (review-candidates router, legacy Review workspace context only) on their existing _display_payload functions; no new endpoints, no new permission keys, no permission removed (Review/Identification permissions remain fully valid for the preserved legacy surfaces) - verified directly by re-reading both routers' diffs, which touch only the existing _display_payload bodies and their imports. A dedicated API-level test (test_api_complete_endpoint_exposes_backend_classification_and_cannot_be_spoofed) proves a client-supplied classification/is_talented/classification_score value in the /complete request body is silently ignored and the response always reflects only the backend-computed result (frontend cannot spoof). Frontend: static/js/talent-operations.js renders the backend classification/Talented state on the Talent assessment detail view and the legacy Review workspace (list table gains a Classification column; detail view gains a classificationVisual block; the legacy Review link is relabeled 'Legacy Review & Identification history'; Review/Official Identification copy is updated to describe those as preserved legacy history rather than a required step) - the literal substring 'Official Identification remains a separate authorized human decision' is deliberately preserved so no existing JS assertion needed to change; static/css/talent.css adds .tp-classification/.tp-classification-talented/.tp-badge-talented rules. No schema migration, no tis.db change (verified byte-identical via SHA-256 before/after), no tenant/SchoolGroup/Branch/privacy/audit boundary change, no AI classification authority introduced, no percentage-band conversion anywhere. Full regression re-verified via git-stash comparison against unmodified HEAD 27c121a: the same 11 Python talent-test failures and the same 16 JS test failures (by exact test name) fail identically before and after this task's changes (confirmed pre-existing, not a regression), plus the three specific pre-existing failures named in this task's spec (test_force_delete_student_history_removes_protected_academic_history, test_query_family_is_bounded_and_not_row_proportional, test_html_students_page_shows_one_panel_level_protected_message_when_every_category_is_suppressed) reproduce unchanged. tests/test_talent_ui.py and tests/test_students_ui.py (M16's own regression suite) pass in full (70/70). M18 (Results & Analytics rebuild, including any Learner Profile/organization-analytics visible-copy implications of the new classification authority) remains explicitly out of scope and was not implemented or touched."
