summary: "THIS TASK (Deployment Acceptance Correction C Closeout - Section scope + endpoint parity regression + KMS precision, on top of 2763b53; tests + KMS wording only; no Learning Style/analytics/privacy/schema semantic change; Web Service only, not deployed): Codex technical audit passed Acceptance C with 0 blocking findings; two bounded closeout items. (1) Added real behavioral tests exercising section_name through BOTH public Learning Style distribution routes (Students /api/students/analytics/learning-style-distribution and Results /api/talent/results-analytics/academic-years/{id}/learning-style): two Sections in one Grade have different mixes, Section A excludes Section B Students, denominator includes Unassigned within the Section, zero categories stay 0/0%, out-of-scope Section/Branch cannot widen scope, and both endpoints agree for the same Branch+Grade+Section filter. (2) Corrected KMS wording precision: the deprecated learning_style_*_percentage columns are operationally deprecated and excluded from current Learning Style analytics and normal product presentation (legacy compatibility paths in student_academic_service.py may still read/write stored values for preservation, never as analytics authority), replacing the overbroad 'unread / never read anywhere' phrasing. PRIOR TASK (Deployment Acceptance Correction C - Learning Style Distribution, on top of 44fcf77; Web Service only, not deployed; no schema/migration/tis.db change, no new permission): owner-observed defect that every Learning Style category showed Unavailable. Root cause confirmed: the distribution ran through the Talent P3 primary/complementary small-cell suppression (10 Students at minimum cohort 5 suppressed every category) and the Results & Analytics frontend read buckets while the route returned levels. Owner decision (ADR 0031 Acceptance C Amendment, ADR 0044 note): the Learning Style distribution is authorized Student-domain aggregation and is NOT subject to Talent small-cell suppression; no other Talent privacy class changed (talent_analytics_privacy.py untouched; Classification/Talented still suppress). student_learning_style_analytics.build_distribution(students) returns nine categories with key/label/count/percentage plus total_population over one denominator that includes Unassigned; zero is 0/0%; empty population is state empty; no per-Student percentage and the deprecated learning_style_*_percentage columns are operationally deprecated and excluded from current Learning Style analytics and normal product presentation (legacy compatibility paths may still read/write stored values, never as analytics authority). Students API route, Students panel and Results /learning-style route no longer use the privacy provider; resolve_population and students.view unchanged. Frontend: talent.js learningStyleDistributionSection plus students.html panel render count, percentage and backend-percentage bars. Tests: new tests/test_student_learning_style_distribution_acceptance_c.py and tests/talent_learning_style_distribution.test.cjs; replaced the suppression tests in tests/test_student_learning_style_v1.py (retiring the stale failing panel-message test). KMS amended: ADR 0031, ADR 0044, PROJECT_STATE, TIS_MASTER_CONTEXT, AI_PROJECT_CONTEXT, TIS_MODULE_MAP, USER_AND_SYSTEM_FLOWS, CHANGE_HISTORY. PRIOR TASKS in this branch (unchanged): Acceptance A loader hardening (507dc59, b7e3c6a) and Acceptance B student identity/automatic classification/legacy history removal plus remediation (39907e9, 44fcf77)."
