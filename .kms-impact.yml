knowledge_impact: no
summary: "Added scripts/diagnose_user_permissions.py, a read-only operational diagnostic CLI (--email, --permission-key) that traces one user's permission resolution by calling the existing canonical services end to end (permission_registry.get_default_permissions_for_role, role_permission_service.get_role_permission_rows/get_allowed_permission_keys, user_permission_service.get_user_overrides, auth.get_allowed_permission_keys). It duplicates no resolution logic, performs no db.commit()/INSERT/UPDATE/DELETE, adds no HTTP route, and never prints DATABASE_URL, password hashes, tokens, or secrets, including on database-connectivity failure paths (a generic 'database_unavailable' message is emitted instead of the raw exception). Follows the existing sibling convention of scripts/diagnose_subscription_resolution.py and scripts/diagnose_workspace_classification.py (governed read-only local diagnostic tools with focused tests in tests/, e.g. tests/test_diagnose_payment_lifecycle.py). Added a matching minimal regression test file, tests/test_diagnose_user_permissions.py, covering not-found, unknown-permission-key, user-override-affects-final-effective-result, and no-secrets-in-output. No precedence rule, permission key, schema, migration, role/tenant/branch resolution behavior, or route/template changed; auth.py, authorization.py, role_permission_service.py, user_permission_service.py, and ui_shell.py were not modified. tis.db was not modified (hash unchanged, verified before and after)."
affected_areas:
  - operational_tooling
