summary: "Further Owner corrective pass on top of pushed commit 778641a: TalentProgramAcademicYearConfiguration.is_enabled (and the configuration row's existence at all) is removed as a blocking condition from the normal Student Assessments roster and Start Assessment path only. talent_assessment_cycle_service.py's current_placements_for_assessment and talent_student_assessment_service.py's _current_placement_for_assessment no longer query/require an enabled TalentProgramAcademicYearConfiguration row - the Evaluation/Cycle already supplies the Academic Year, and a Student's valid current Placement in that exact Academic Year is sufficient. Kept unchanged: School Group (tenant) isolation, Branch authorization (enforced by the calling route), Academic Year match, current Student Placement requirement, the saved Competency+KPI+Level requirement (ADR 0039's own core decision, in _newest_assessable_framework, untouched), and immutable historical evidence protection. derive_eligible_population (the legacy M4/frozen-population path used by Cycle open/preview/ADR 0033 reconciliation) is UNCHANGED and still requires an enabled annual configuration for its own callers - not rewritten, per the explicit instruction not to touch legacy M4/frozen-population behavior. New regression (tests/test_talent_assessment_cycle_frozen_population.py::test_normal_roster_and_start_work_with_no_annual_program_configuration_at_all) proves a Program with a saved Competency+KPI+Level and NO annual configuration row at all still shows the Student in the live roster and allows Start Assessment, and separately proves the same with an explicitly disabled (is_enabled=False) configuration row present. No schema migration was required. Zero new test regressions were introduced, confirmed by direct before/after comparison; the same three pre-existing failures in tests/test_talent_assessment_cycle_frozen_population.py already present before this pass (and before the immediately-prior corrective pass) remain identical and unaffected."
