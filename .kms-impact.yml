summary: "Owner follow-up before deployment: add a Grade-to-Grade full Assessment Criteria copy capability to the Talent Program Competency/KPI/Level builder, on top of pushed commit 8c6a05f. New backend service function talent_program_service.copy_grade_criteria(db, *, school_group_id, program_id, framework_id, source_grade_level, target_grade_level, expected_revision, actor=None) and router endpoint POST /api/talent/programs/{program_id}/frameworks/{framework_id}/grades/copy (permission talent_programs.manage) copy the complete Competency (name, description, display order), KPI/rubric (name, description), Level (code, label, description, display order, numeric value), and descriptor (generic and Grade-specific, remapped to the destination Grade) structure from one Grade to an empty destination Grade within the same current Framework build. Every copied row is an entirely independent new record (new TalentCompetency, FrameworkCompetency, TalentRubric, TalentRubricLevel, TalentCompetencyRubricDescriptor/TalentGradeCompetencyRubricDescriptor) with its own identity - never a shared/linked row with the source Grade - mirroring the existing 'add a Competency to a Grade' flow's own precedent of minting a new TalentCompetency per Grade membership (a Competency can only belong to one Grade per Framework in this model's own uniqueness constraint). Safety-first design per explicit Owner instruction: an already-populated destination Grade is always rejected (target_grade_occupied) rather than silently merged or overwritten - no automatic merge/Replace flow was implemented in this pass, matching the Owner's explicit permission to keep the first version to empty-target-only. The function reuses the existing _require_mutable_draft gate unchanged, so it can never mutate a Framework with Assessment history directly; the frontend (static/js/talent-program-workspace.js) orchestrates the identical version-safe clone-then-mutate pattern already established for versioned Delete Competency (clone the immutable/active Framework into a new draft via the existing create_framework_draft(clone_from_id=...) path, then run the copy against that new draft) so the Owner never needs to understand Framework cloning/versioning. The new 'Copy Criteria From Grade...' action is a structural, always-visible text action at the Grade-section level (not an inline Edit/Delete icon), offers only source Grades that actually contain criteria (Grades without criteria are omitted, not shown disabled), excludes the current destination Grade from its own source list, shows the exact Owner-specified confirmation text naming the real source/destination Grade labels, and on success keeps the Owner in the destination Grade section within the Program builder (no navigation to a different screen) with a concise success notification. Copied items retain full ordinary Edit/Delete/collapse behavior identical to manually-created items - there is no separate read-only path for copied content. Scope is bounded to the exact same SchoolGroup, Program, and Framework as every existing Program-service mutation (identical _authorize/_framework scoping pattern reused unchanged; verified via a dedicated cross-tenant/cross-program regression that a caller cannot reach another SchoolGroup's Framework by id or guess a different Program id under its own group). New regression coverage: tests/test_talent_program_grade_criteria_copy.py (8 tests: full structure copy with order preserved and independent identities, descriptor/grade-descriptor copy with remapped Grade and new ids, editing the copied Grade never alters the source Grade, same-Grade rejection, empty-source rejection, already-populated-destination rejection with no partial writes, tenant/Program/Framework boundary enforcement, copied records retain ordinary edit/delete capability), one added assertion in tests/test_talent_student_assessment_competency_results.py proving copy_grade_criteria is blocked with framework_in_use exactly like the existing sibling mutators when the Framework has real Assessment history, and 5 new tests in tests/talent_program_workspace.test.cjs covering the structural action's placement/source-exclusion/disabled-source rules, the already-populated-destination block message, the exact confirm text and API payload on a mutable build, and the clone-then-copy orchestration against an immutable/active build. No new schema migration. Zero new test regressions across the full focused Talent Python and Node suites, confirmed via git-stash before/after comparison (identical pre-existing failure sets in tests/test_talent_rubric_kpi_candidate_policy.py, tests/test_talent_assessment_cycle_frozen_population.py, tests/test_talent_ui.py, tests/talent_program_workspace.test.cjs, and tests/talent_operations.test.cjs, all unrelated to this change)."
