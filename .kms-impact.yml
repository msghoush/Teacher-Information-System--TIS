knowledge_impact: yes
summary: "Owner-directed Talent & Potential simplification. ADR 0035 supersedes ADR 0033 and the M4 frozen-population rule wherever Draft/Open Cycle state, frozen roster membership, synchronization, reconciliation, or population membership acted as prerequisites to start/edit a Student Assessment. Current effective Academic Placement in the selected Academic Year plus Program eligible Grade and an active assessment framework/tool are now the operational eligibility authority. Student Assessments reads live eligible Students directly, shows Start Assessment without an Open Evaluation step, and posts cycle_id + student_id. The backend validates current Placement/Grade/Branch scope, captures the existing Cycle Population Member row only as a historical placement/framework snapshot at Assessment creation, and keeps legacy Cycle state as internal compatibility metadata rather than a user-facing gate. Evaluation Plan UI now opens Student Assessments directly; it no longer previews/freezes/opens a roster or exposes Draft/Open gating as the normal workflow. Existing completed evidence remains immutable, tenant isolation and permissions remain enforced, and no schema migration is introduced."
