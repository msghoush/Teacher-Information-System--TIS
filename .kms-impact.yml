knowledge_impact: no
summary: Targeted acceptance-testing hotfix on dev at f7a8bc2 (PR #317, since merged to master/6153474 and deployed; this hotfix work is new uncommitted local work on top of that deployed commit, not yet released). Reproduced and fixed two real defects with direct evidence, not inference. (1) static/js/talent.js contained literal double-encoded UTF-8 (mojibake) text - confirmed by reading the raw file bytes/codepoints, not just visual inspection - corrupting the arrow suffix on every "Open <View>" Talent nav link plus several middle-dot separators, an em dash, a bullet, and loading-ellipsis strings; every corrupted codepoint sequence was replaced with the correct single UTF-8 character and a new Node regression test (tests/talent_ui.test.cjs) asserts the file never again contains the U+00E2/U+00C2 lead-byte signature of this corruption class. (2) The Learning Style distribution panel on the Students list (templates/students.html) repeated an identical "Protected for privacy" line on every category row whenever every category was suppressed; confirmed against the sanctioned .local_test_data/talent_local_test.db (8 active Students, every Learning Style category count below the existing RELEASE_1_MINIMUM_COHORT=5 threshold) that suppression itself is correct, not a bug - only the presentation was wrong. Fixed to show exactly one panel-level explanation when every category is suppressed (category labels still render; per-row text is only shown in a genuinely mixed visible/suppressed state), with a new focused pytest regression (tests/test_student_learning_style_v1.py) proving exactly one panel-level message renders, no count/percentage leaks, and every category label remains present. No privacy threshold, suppression rule, permission, schema, route, or backend contract changed - both fixes are presentation/encoding-only. (3) Owner-reproduced-in-browser Learning Style click/select defect: reading templates/_learning_style.html's shared learning_style_field macro found the native <label> already directly wraps its <input type="radio">, sharing one name across all options (correct semantics needing no JS), but the selected-value comparison (`selected == option`) used strict equality against a Python `None` for any Student whose learning_style was never set (the real, common DB state for this brand-new nullable column) - `None == ''` is False in Jinja/Python, so on Edit Details for an existing Student with no saved value, no pill (not even "Not specified") was ever pre-selected on load, unlike the create-Student form which explicitly passes ''. Fixed by normalizing `selected = selected or ''` once at the top of the macro so a None/unset value now correctly resolves to and pre-checks "Not specified", matching create-Student behavior; a new pytest regression proves this (previously failing, now passing), plus a new structural regression proves every stu-ls-option label's first child is its own radio input (no intervening/overlapping element) and the page has no duplicate id. Defensively also hardened static/css/students.css so `.stu-ls-option input` fully owns its own border/padding/background/border-radius instead of leaving those specific properties to an equal-specificity ambient `.stu-field input` rule (only width/height/margin were previously owned) - a real cascade fragility found by reading the CSS, not confirmed as the literal browser-reproduced root cause (no browser available in this environment to visually confirm), but a legitimate hardening of the exact control in question. (4) Confirmed-by-Owner Finish Setup navigation defect: static/js/talent-program-workspace.js's finish-setup action handler called `window.history.replaceState(null,'',window.location.pathname+window.location.search)` then `render(ctx)` again with the *same* ctx object; since `render()` derives the displayed Program from `ctx.params.get('program_id')` (a captured/passed-in URLSearchParams, never re-read from the live address bar), replaceState only cosmetically trimmed the hash from the URL bar while re-rendering the identical operational-summary/wizard for the same Program - the query-string-retention hypothesis from an earlier pass was directionally right but incomplete (ctx.params staleness, not just the URL string, is what actually kept the user on the same Program). Fixed by calling the existing shared `ctx.navigate('programs')` full-navigation helper (already provided by static/js/talent.js's workspace dispatch and already used by static/js/talent-operations.js for an equivalent cross-view exit) instead of the bespoke replaceState+re-render, producing a real navigation to the canonical Programs list with no program_id, no hash, and no setup/edit state. New Node regressions in tests/talent_program_workspace.test.cjs assert the finish-setup handler calls ctx.navigate('programs') with no extra params for both a ready/Active Program and a direct deep-link into the Ready step, and separately confirm a Draft Program's "Finish Setup" is a plain step-link (setupComplete requires program.status==='active'), not this JS action, so it was never affected by the bug. (5) Owner-confirmed, release-blocking "repeated Loading Programs..." defect: reading static/js/talent-program-workspace.js's render(ctx) end to end (not inferring from any prior summary) found the module's own hashchange listener - `hashGuard=()=>render(ctx);`, bound whenever the wizard is showing (Basics/What we assess/Evaluation Plan/Ready step nav, and the assess substeps Competencies/Rubric Levels/Descriptions/Review, which are all real `#hash` anchors) - called the exact same top-of-function fetch chain as a real page load on every same-page step click: unconditionally blanking `root.innerHTML` to "Loading Programs…" and re-fetching the entire `/api/talent/programs` catalog plus this Program's full setup graph (academic-year config, framework versions, competency bank, the chosen framework+configuration, and the Evaluation Plans list), even though none of that data depends on which wizard step is being viewed. This is separate from, and layered underneath, static/js/talent.js's own generic "Loading this view…" (talent.js's `load()`/`render(signal)` dispatcher, which already correctly scopes its pending state to a real request and already has a working generation/AbortController staleness guard - unmodified, confirmed correct by inspection); the workspace's own hashGuard bypassed that outer machinery entirely by calling the raw `render(ctx)` directly. Fixed with the minimal reversible change of an optional `render(ctx, {viaHash:true})` mode: hashGuard now passes `viaHash:true`, and a same-Program-context (Program id + Academic Year + requested framework version) bundle cache lets a hash-only step navigation reuse the already-fetched Program/framework/competency/Evaluation-Plan bundle instead of re-blanking and re-fetching - `root.innerHTML` is never set to "Loading Programs…" for a same-context step change. Every real trigger (initial load, the shared Refresh control, an Academic Year/Program context change, and every post-save `refresh()` after `mutate()`) is called without `viaHash` and therefore always performs a fresh fetch and refreshes the cache, so Refresh/save/context-change correctness is unchanged; a `renderToken` guard was added around the fetch path itself so a superseded in-flight fetch-path render can never overwrite the screen with a stale response. Seven new Node regressions in tests/talent_program_workspace.test.cjs prove: a hash-only step change reuses the cached bundle with zero additional `/api/talent/programs` calls and no "Loading Programs" flash; the correct step panel still redraws from cached data; a changed Academic Year/Program context is a cache miss and always fetches fresh; an explicit (non-hash) render always fetches fresh even with a matching cache; a save immediately reflects the newly saved data on the next hash-only render (never a pre-save cached value); a failed initial fetch never poisons the cache, so the next hash-only render safely falls back to a real fetch; and rapid duplicate hash-only navigations issue zero additional Program-list requests. All 23 pre-existing tests in that file, all other Talent Node suites (talent_ui, talent_evaluation_workspace, talent_operations, talent_results_experience, talent_rubric_visual - 93 Node tests total), and the existing Learning Style pytest regression (20 tests) pass unchanged, confirming items (1)-(4) above remain intact. No browser was available in this environment (re-verified this pass, consistent with the prior pass's finding); verification here is Node-test call-count/DOM-string evidence over the actual production module, not a live-browser network trace. No privacy threshold, suppression rule, permission, schema, route, or backend contract changed; no caching architecture was added beyond this bounded, invalidation-safe, same-context bundle reuse inside the one already-existing render function. Every other P0 item in the delegated hotfix task (Save/Remove button behavior beyond Finish Setup and this loading defect, analytics Organization/Branch/Grade/Section filter cascade interactivity) remains explicitly deferred to manual Owner reproduction, per this task's explicit scope boundary; no speculative code was changed for those items. (6) Owner-confirmed, video-evidenced "Program context integrity" defect: the shared upper Talent ribbon/context Program selector (static/js/talent.js's #tp-program, populated and read in init()/applyContext()) and the Programs workspace (static/js/talent-program-workspace.js) can only ever diverge through the one live-DOM <select> assignment in init() - every other Program-dependent code path (TalentProgramWorkspace.render, TalentEvaluationWorkspace.render, and every embedded/standalone Talent view) already reads canonical program_id exclusively from the one shared ctx.params/URLSearchParams object (never an independent local "selectedProgram" copy - confirmed by exhaustive read and grep across static/js/talent.js, talent-program-workspace.js, talent-evaluation-workspace.js, and talent-operations.js, none of which contain a second Program-selection variable), and the existing renderToken guard in talent-program-workspace.js (added by the immediately-prior viaHash pass) already prevents a superseded in-flight Program fetch from overwriting a newer Program's rendered state, confirmed by a new targeted regression proving a deliberately stale/delayed Program-A response cannot overwrite an already-rendered Program-B. The one real, previously-implicit gap was the ribbon <select>'s value assignment (`if(params.has('program_id'))program.value=params.get('program_id')`), which relied on the browser's own unmatched-value-falls-back-to-first-option behavior rather than an explicit, testable contract - hardened by extracting a small pure resolveProgramSelection(items, requestedId) function (exported from static/js/talent.js) that selection is by program_id only (never by name, and two Programs may share a name), and an absent/unmatched id always resolves to the neutral "" (no Program selected) state, never the first Program in an async-loaded list. init() now calls this resolver unconditionally instead of relying on the select element's implicit fallback. This is a behavior-preserving hardening (the prior implicit default was already "" in every reachable case), made explicit and now directly regression-tested. No jsdom dependency exists in this repository (confirmed: no node_modules, no package.json declaring it), so the live DOM-wired init()/applyContext()/hashchange wiring in talent.js itself remains untestable via `node --test` in this environment exactly as it was before this pass; the new tests instead exercise the extracted pure resolver and the real, already-DOM-independent talent-program-workspace.js render(ctx) function with two distinctly-named fixture Programs (id-based matching, a real context-change fetch/cache-bypass, and the async-staleness guard). Browser back/forward was analyzed, not verified live (no browser available): the shared context/ribbon mechanism uses history.replaceState exclusively (never pushState) for every in-page filter/Program change, so no client-side SPA history-stack entries exist to desynchronize from canonical program_id in the first place - a real Back/Forward always leaves the Talent SPA page (or restores a full prior DOM snapshot via bfcache) and init() unconditionally re-derives every field, including the resolved Program selection, from location.search on that fresh load. Files changed: static/js/talent.js (resolveProgramSelection extraction/export/wiring), tests/talent_ui.test.cjs, tests/talent_program_workspace.test.cjs (new regressions only - talent-program-workspace.js itself required no behavior change, since its canonical-id-only, cache-invalidating, staleness-guarded architecture was already correct). No schema, permission, privacy, route, or backend contract changed.
