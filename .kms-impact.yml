knowledge_impact: yes
summary: "M6 implementation (Students module milestone numbering, distinct from the unrelated Talent-domain 'M6 Review' entry already in PROJECT_STATE.md): Student Roster Import/Export backend, following the Owner-approved governance prerequisite (students.import/students.export permission registration, 2026-09-22, commit 45a2dec). First release, .xlsx-only, no frontend (M11 later), no persistent import-job/batch table, no schema/migration. New bounded service student_roster_service.py: CREATE-ONLY import for this release (every workbook row enrolls a NEW Student with an initial Academic Placement - explicit judgment-call scope decision, not previously documented; updating an existing Student via roster file is out of scope), stateless zero-mutation preview, and an apply that independently re-parses/revalidates the freshly uploaded workbook (never trusting a client-submitted preview payload) and applies atomically with all-or-nothing rollback (including a fresh IntegrityError race at apply time, classified generically as student_id_conflict, never raw DB error text). Reuses student_academic_service.py's canonical Student/TIS Student number (ADR 0043/M2)/Academic Placement invariants throughout (create_student_with_number, create_placement) rather than duplicating them. Extracted one new shared helper in student_academic_service.py, describe_student_number_conflict(), from the existing single-Student create/replace 409 conflict handler in routers/students.py (routers/students.py now calls it too) so the direct API, roster preview, and roster apply all share exactly one implementation of the ADR 0043/M2 privacy-safe conflict-disclosure contract (same-tenant + students.view reveals student_id/display_name; cross-tenant or unauthorized same-tenant is fully generic) - no richer or different disclosure path was created for either. Three new routes in routers/students.py, each server-side permission- and scope-gated via the existing _authorize/auth.has_permission/auth.can_access_branch pattern already used by every other students.* route: GET /api/students/roster/export (students.export) streams an .xlsx workbook via openpyxl (matching routers/subjects.py's existing StreamingResponse convention); columns student_id/first_name/father_name/last_name/gender/status/branch/academic_year/grade/section/section_display; tenant-isolated, Branch-restricted actors only see Students whose CURRENT effective Academic Placement Branch is in their accessible-Branch set (mirrors existing granular Branch-gating in routers/students_ui.py); Student ID written as canonical STD+10-digit TEXT cell (number_format='@') so Excel never strips leading zeros/applies scientific notation, blank (never fabricated) for a legacy Student with no managed number; section_display reuses academic_grade.format_section_display unchanged (ADR 0045) as a strictly additive column - canonical section/grade_level are never replaced by it, and Grade/Section import matching uses only canonical PlanningSection identity, never the display label, even for the Al-Andalus-authorized workspace. POST /api/students/roster/import/preview and POST /api/students/roster/import/apply (students.import): safe .xlsx-only parsing (load_workbook(..., data_only=True, keep_links=False) - a formula cell is read as its cached value and never evaluated, external links dropped), explicit 5MB upload-size and 2000-data-row bounds (this feature's own documented judgment call; no existing repo-wide upload convention was found), bounded structured per-row/file error contract ({row, field, error_code, safe_message}; file-level errors use row=null/field=null) - never a raw exception, SQL error, or sensitive tenant detail. students.import/students.export are reclassified from dormant/reserved (status D) to active-enforced (status A) in tests/test_permission_registry_matrix.py, matching the subjects.import/subjects.export precedent (discovered consumer: routers/students.py, via the same _authorize guard-call pattern used by every other students.* key); dormant count 15->13, active count 143->145, total registered keys unchanged at 177; no role-grant/default-permission-set change - the 2026-09-22 governance decision is unchanged, only enforcement status now reflects that real routes exist. 40 new focused tests added in tests/test_student_roster_import_export.py (isolated in-memory SQLite + minimal FastAPI app mounting only routers/students.py) covering export tenant/Branch isolation, deterministic columns, Student-ID text-cell/leading-zero preservation, legacy-no-ID handling; preview statelessness, file/structural/row-level error classification (invalid extension, malformed/oversized workbook, missing/unexpected/duplicate columns, invalid/duplicate Student ID, same-tenant and cross-tenant privacy-safe conflict disclosure, invalid/cross-tenant/unauthorized Branch, invalid Academic Year/Grade/Section, missing values, invalid gender, safe formula-cell handling); apply atomicity, independent revalidation (never trusting preview output), one-invalid-row full rollback, Student-ID race-after-preview rollback, permission/scope re-checking, and historical-placement non-corruption; and M5/ADR 0045 regression proving section_display is never import matching identity and stays additive-only (and unchanged/fallback) on export for both the Al-Andalus workspace and every other tenant. All 40 new tests pass; tests/test_permission_registry_matrix.py's own 13 tests pass with the updated classification/counts. Regression sweep (tests/test_students_ui.py, test_student_academic_foundation.py, test_student_managed_number_service.py, test_student_tis_number_identifier_foundation.py, test_al_andalus_section_display.py, test_academic_grade_section_display.py, test_permission_management.py, test_permission_qualification.py, test_permission_closure_22_keys.py, test_permission_surface_consistency.py, test_permission_route_coverage.py, test_permission_surfaces_accessibility.py) is 300 passed / 1 failed - the 1 failure (test_student_academic_foundation.py::test_force_delete_student_history_removes_protected_academic_history, an ObjectDeletedError unrelated to Grade/roster/permission code) was independently reverified present on unmodified dev HEAD (45a2dec) via git stash before/after and is not caused by this change. The previously documented unrelated pre-existing failure in tests/test_permission_dangerous_patterns.py (saas/promo_redemption_service.py, saas/router.py) was also reverified still present and still unrelated. docs/PROJECT_STATE.md gained a new dated entry ('Student Roster Import/Export Backend Implemented (M6)') recording actual implementation truth above the existing governance-prerequisite entry (which is preserved unchanged, historical record). docs/CHANGE_HISTORY.md gained a matching new entry. No schema, migration, or frontend/UI change; tis.db unchanged (verified via SHA-256 before/after)."
