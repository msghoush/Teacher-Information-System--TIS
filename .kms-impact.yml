summary: "THIS TASK (Deployment Acceptance Batch 1 - data correctness, scope integrity, Student deletion and loading, on top of cd3a1be; Web Service only, not deployed; no schema, migration, permission or tis.db change). (1) Root cause of the Overview 'Students participating = 63 while 9 Students exist': the headline was the frozen-membership row count (one TalentAssessmentCyclePopulationMember per Student per open/closed Cycle/Program) labelled as Students, and the population queries never checked the Student still exists. Fix: talent_current_students.current_student_exists is composed into population_query, frozen_membership_query, the Evaluation Progress Branch reads and list_assessments; the Overview adds distinct_students (existing distinct-Student authority, class P2, existing student_drill_population/count/distinct_student coordinate, ADR 0044 Batch 1 amendment) and an authorized branch_id; labels state their grain (Students participating = distinct current Students, Program participations, Assessments completed, Talented results). (2) Student deletion: exhaustive FK audit found ten Student-owned tables, all already removed by force_delete_student_history; the list is now STUDENT_OWNED_MODELS locked to ORM metadata by test; permission model unchanged (normal and bulk Delete stay blocked by history); the ObjectDeletedError failure was a test defect. (3) Global Branch context: the sidebar Branch only set the session scope and Talent ignored it; talent_ui renders the validated active Branch as tp-config.branch, talent.js reconcileBranchScope makes it the default scope, clears a stale Branch/Grade/Section from another Branch's URL and honors explicit All Branches; Overview, Program Results (/program-portfolio previously ignored branch_id) and the eligible-students roster accept an authorized branch_id; backend authorization unchanged. (4) Loading/performance: measured row-proportional N+1 (assessments list 982 statements for 20 rows, drill 136, classification 74, branch comparison 84, evaluation plans 140, access context 31-34) fixed with opt-in request-scoped talent_read_batch memoization, set-based priming and a per-request permission checker; the Assessments page requests only its Year/Program; /programs/summaries HTTP 500 fixed; Talent assets are content-hash versioned; an inline 15 s watchdog ends a still-untouched server loader in an explicit error; Render capacity not shown to be implicated (production cannot be measured here). Tests: tests/test_talent_batch1_data_scope.py, tests/test_student_delete_completeness_batch1.py, tests/talent_branch_scope_and_metrics.test.cjs, additions to tests/test_talent_ui.py, shared tests/talent_test_students.py; stale pins updated deliberately (fixtures now create real Students; drill ceiling 12 -> 18 (fixed family of 17); script regex accepts ?v=). KMS: PROJECT_STATE, CHANGE_HISTORY, AI_PROJECT_CONTEXT (duplicate Acceptance C heading removed), TIS_MASTER_CONTEXT, TIS_MODULE_MAP, USER_AND_SYSTEM_FLOWS, ADR 0044. CLOSURE (2026-09-25, same task boundary, supersedes the Batch 1 default-only Branch wording): the global Branch is a HARD Talent scope. talent_branch_scope.py computes the ceiling server-side from the request user (intersection of actor authorization and active global scope) and composes it into the M10 access context and every Talent router visible-Branch resolution (organization analytics, analytics, results analytics incl. Learning Style, Evaluation Progress, Assessments, Cycle roster/population, learner profile, legacy review/identification/educator lists, selector option lists); an explicit other Branch is rejected and an omitted Branch resolves to the ceiling. Added an explicit global All Branches state (branch_scope=all marker cookie via POST /scope/branch branch_id=all, user.scope_all_branches, option shown only on /talent pages; other modules unchanged) because no organization-wide global state existed. talent.js treats config.branch as a ceiling (no All Branches or other Branch offered or sent, stale URL clamped). Student deletion, inactive-Student and Talented-KPI semantics unchanged; no schema, migration, permission or tis.db change. Tests: tests/test_talent_branch_hard_scope.py, Node B3/B4/B6/B6b, updated Batch 1 fixtures. KMS: same seven docs, with dated correction notes. AGENT 2/3 CUMULATIVE ADDITION (2026-09-25): request-backed Student Assessment filters and canonical summaries; Agent 3 owner privacy amendment protects Classification-filtered Learning Style cohorts while preserving individually authorized operational rows; current reassessment provenance; bounded repeatable-snapshot aggregate dashboard with P2/P3/P4 provider rules, six selected comparison groups, Program-bound rubric indicators, no cross-framework result pooling; six-section aggregate UI, executive Overview charts, Program cards, shared accessible privacy-safe chart modes and surface-specific bundles; adversarial backend/frontend regression. The four previously omitted cumulative KMS declarations remain restored for origin/master...dev. AGENT 3 RECOVERY COMPLETION (2026-09-25): audited and completed the interrupted local Agent 3 worktree; removed re-introduced generic privacy copy (M18a), fixed the inert Program summary Finish Setup control, replaced emoji icons, added the Talent visual-system stylesheet layer, Program grade chips and backend/Node regression (Overview agreement, statement bound, route-level protected Learning Style, exact roster rows, chart-mode matrix, Program Status absence). Visual results structurally verified only. No schema/migration, tis.db, deployment, master merge or release PR change."
