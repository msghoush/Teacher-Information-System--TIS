summary: "Students + Talent & Potential M1: governance reconciliation plus additive persistence/schema foundation only, for two later capabilities - a four-dimension Student Learning Style profile and the globally unique managed TIS Student ID namespace. No API, service write path, or frontend was added; both remain explicitly out of scope for M1. Student gains four independent nullable INTEGER columns (learning_style_verbal_percentage, learning_style_non_verbal_percentage, learning_style_quantitative_percentage, learning_style_spatial_percentage), each constrained to NULL or 0-100 with no sum rule, via new migration 20260922_001_student_learning_style_four_dimension_profile (ALTER TABLE ADD COLUMN plus, on PostgreSQL only, a NOT VALID/VALIDATE CHECK per column, mirroring the existing 20260910_002_student_learning_style_v1 precedent's documented SQLite/PostgreSQL asymmetry). The legacy categorical learning_style column, its CHECK constraint, and every existing row are completely unchanged - no rewrite, mapping, or automatic conversion in either direction. StudentExternalIdentifier gains no new column; new migration 20260922_002_student_tis_number_identifier_integrity adds two partial unique indexes scoped to namespace = 'tis_student_number': global uniqueness of value across every SchoolGroup covering both active AND inactive rows (a retired value can never be reissued), and at most one active row per student_id (correct organization-wide because Student.id is already a single global primary key). Every other namespace's existing tenant-scoped uniqueness (uq_student_external_identifiers_scope_namespace_value) is unchanged. Before installing either index, the migration inspects any existing tis_student_number rows and fails safely with a descriptive RuntimeError (no delete/merge/rename) on a non-canonical value (not STD + exactly 10 digits), a value duplicated across SchoolGroups, or a Student with more than one active row; tis.db and every exercised test database had zero pre-existing tis_student_number rows, so this path was exercised only via seeded-conflict tests. Student.id remains the sole internal relational identity; no new Student identity table/column and no backfilled/fabricated tis_student_number for existing Students. Governance reconciliation: ADR 0031 (Student Learning Style V1, single-select categorical) is preserved verbatim with an added 'Amended by ADR 0042' note (frontmatter amended_by plus an inline bullet-level note, following the exact ADR 0020/ADR 0041 precedent) clarifying that the new four-percentage profile is a separate, independent representation and not the multi-style scaffolding ADR 0031 explicitly declined to build speculatively - the categorical field, its four values, and single-select nature are unchanged. New ADR 0042 (amends ADR 0031) authorizes the four-percentage schema foundation, zero Talent-scoring effect, and explicitly no history/version/snapshot table. New ADR 0043 authorizes the tis_student_number global managed-identifier invariant (no prior ADR/KMS document governed this namespace; confirmed by full-repository search before authoring). Regression coverage: tests/test_student_learning_style_profile_foundation.py (20 tests: migration additive/idempotent/no-op, ORM nullability, 0/100 boundaries, independence/no-sum-rule, out-of-range rejection for all four columns, legacy-field preservation, zero-Talent-read source scan) and tests/test_student_tis_number_identifier_foundation.py (17 tests: migration additive/idempotent/no-op and three distinct fail-safe preflight-conflict paths plus the clean-data success path, general-namespace tenant-scoped uniqueness unchanged, tis_student_number global uniqueness across/within SchoolGroups, inactive-value permanent reservation, one-active-per-Student, legal inactive+active pair, legacy Student with zero identifiers). Two new PostgreSQL migration tests were added to tests/test_postgresql_migration_transactions.py following its existing TIS_TEST_POSTGRESQL_URL skip-marked convention exactly (full fresh-chain upgrade + idempotency + live constraint proof, and preflight-conflict-triggers-safe-rollback-with-no-marker); both auto-skip in this environment (no TIS_TEST_POSTGRESQL_URL, no local PostgreSQL listener). Full relevant regression suite (tests/test_student_learning_style_v1.py, tests/test_student_academic_foundation.py, tests/test_students_ui.py, tests/test_postgresql_migration_transactions.py, plus the two new files) passes except two pre-existing failures confirmed unrelated and present on unmodified HEAD a94013e (test_html_students_page_shows_one_panel_level_protected_message_when_every_category_is_suppressed and test_force_delete_student_history_removes_protected_academic_history)."
