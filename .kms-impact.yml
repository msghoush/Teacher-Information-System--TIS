knowledge_impact: yes
summary: "Phase 2 (User Exceptions UX): replaced the edit-user 'Per-User Permission Overrides' panel (three-way Inherit/Allow/Deny radios, bulk save) with a 'User Permission Exceptions' section. The normal UI is binary Allow/Deny plus a Reset to Role Settings button shown only when a direct exception exists; Inherit is never a user-facing choice, while internally an absent override row still means follow-the-role and apply_user_override(..., 'inherit') stays the deletion primitive. user_permission_service.build_user_permission_payload gained additive read-only fields (standard_allowed, school_override, exception, exception_inert, has_exception, source, blocked_by_account) composed from the existing role_permission_service and auth helpers; effective still equals auth.get_allowed_permission_keys (fails closed for inactive users/mismatched scope). A stored user Allow under a role-level Deny is shown as Effective Deny, 'stored, currently ineffective', kept in storage, and never displayed as effective. POST /users/permissions/{user_pk} remains the single guarded route and gained an optional change='<key>|<allow|deny|reset>' form field that applies exactly one change (reset -> inherit; malformed values rejected without a write); the legacy paired permission_keys/permission_decisions contract is unchanged. Tenant/platform scope resolution, platform-only and non-assignable rejection, and ADR 0040 precedence are untouched. The user summary (name, login, role, school, branch, status) is built in routers/users.py _build_user_permission_context. A key that is not assignable to the user's current role renders locked with no Allow/Deny button; a stored exception on it (e.g. after a role change) is kept and shown with only Reset to Role Settings, which deletes the row and grants no authority. 'inherit' remains only the internal, backward-compatible API form of clearing an override. Template uses native details/summary, server-rendered aria-pressed, aria-labelled buttons, focus-visible outlines, and per-row anchors. No schema, migration, new permission key, or second resolver. tis.db was not modified (SHA-256 verified identical before and after)."
