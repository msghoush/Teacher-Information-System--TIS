no_impact_reason: These are presentation/client-navigation/runtime bug fixes. The Student acceptance additions display the already-persisted Learning Style on the existing desktop/mobile list, collapse an entirely suppressed distribution into one intentional protected state, distinguish Placement cascade validation/network/configuration states, add a pending state, and direct an already-placed Student to the existing governed transition transaction. They do not change privacy thresholds, suppression, placement lifecycle rules, permissions, schema, routes, backend contracts, or documented architecture. The existing privacy contract, ADR 0031 V1 scope, Student placement history contract, and backend computations remain accurate. The Program context-integrity item (6) is a pure client-side selection/state-synchronization hardening plus regression tests; canonical program_id was already the sole cross-module source of truth in the Programs workspace before this pass, so no routing, permission, privacy, or backend contract changed.
