summary: Implement and document M3 Framework-versioned rubric levels and competency descriptors, optional bounded KPI configuration, deterministic Review Candidate Policy configuration, semantic revision/fingerprint and clone integration, audit, tenant integrity, API contracts, migration, and tests. M3 Governance Closure additionally approves weighted_level_average as a bounded closed KPI primitive, defines rubric_level_at_or_above as configured-order-based (not numeric_value-based) semantics, and widens the existing TalentConfigurationAudit resource_type CHECK constraint (model + M3 migration) so every M3 mutation audits its specific child resource instead of only framework_version.
