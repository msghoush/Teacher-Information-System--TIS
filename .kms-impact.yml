knowledge_impact: yes
summary: "Fixed a live Owner-reproduced permission inconsistency: a tenant Al-Andalus Administrator correctly had Subjects hidden from the sidebar (auth.get_allowed_permission_keys via ui_shell/build_shell_context) and correctly denied at the direct /subjects route guard (authorization.enforce_route_permission), yet the Dashboard's Subjects tab and Subjects Workspace panel remained fully visible for that same current user. Root cause: templates/dashboard.html rendered its Subjects/Teachers/Planning tab buttons and panels unconditionally -- it never called the already-available canonical can(\"subjects.view\")/can(\"teachers.view\")/can(\"planning.view\") helper that main.dashboard's build_shell_context already supplies from the same auth.get_allowed_permission_keys resolver the sidebar and route guard use. Only the pre-existing Reports tab (can(\"dashboard.view_reports\")) was gated. Fix is template-only and generic (not Subjects-specific): each of the three tab buttons and their matching panel divs are now wrapped in the matching can(...) check, and the previously hardcoded 'active' default tab is now computed as the first permission-visible tab so a user with only teachers.view/planning.view still gets a valid default-active panel. No precedence-rule change, no new permission key, no schema/migration change, no auth.py/authorization.py/role_permission_service.py/user_permission_service.py/ui_shell.py change -- those were inspected and confirmed already canonical and correct. Phase-1 read-only diagnosis of the tracked local tis.db found it does not contain the reproduced tenant Administrator account and predates the user_permission_overrides/role_permission_logical_key_uniqueness migrations entirely (schema_migrations ledger ends at 20260822_...), so this fix and its regression coverage are based on direct code/template tracing, not live tis.db row inspection; this is reported rather than fabricated. tis.db was not modified (hash unchanged) and was not migrated as part of this task."
