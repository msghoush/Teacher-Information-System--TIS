knowledge_impact: yes
summary: The targeted Evaluation Plan denial was classified as a stale disposable local-test identity whose durable BRANCH scope disagreed with the current ORGANIZATION-scoped seed contract; canonical permissions were already present. The fix preserves the KMS organization/global mutation gate, adds a pre-submit read-only explanation for truly Branch-scoped users, proves that organization-scoped managers retain actions with a Branch selected, and uses the sentinel-guarded local reseed path without raw SQL or runtime elevation. Completed active Talent Programs now default to a permission-gated operational summary, explicit edit actions re-enter the same wizard, Finish Setup exits edit mode, the real Academic Year label replaces internal IDs, and approved Evaluation Plan/Evaluation Period terminology plus user-facing organization-authority error mapping are applied without changing backend identifiers or lifecycle rules. The Owner guided-configuration correction now keeps all four Program setup steps on /talent/programs, combines Basics into one panel, renders one assessment substep/editor at a time, embeds the existing governed Evaluation Schedule renderer, standardizes user-facing schedule terminology, and enforces mutually exclusive desktop Student table/mobile cards with neutral normal Active status. The Talent Program workspace now implements its approved four-step flow as a real hash-backed wizard with one active panel, compact readiness, refresh persistence, and governed edit/remove actions using the existing TIS icon treatment. Program hard delete remains absent because the authoritative lifecycle is activate/retire; framework history, terminal assessments, tenant isolation, backend contracts, and schema are unchanged. The shared-worktree work also records: The PostgreSQL pre-deploy migration runner now defers Student/Talent migration-owned tables, applies additive prerequisite 20260904_000 before 001, and establishes equivalent unique parent keys for branches, academic_years, and any existing students table before composite tenant-scoped foreign keys are created. M4 Cycle creation defers its later M8 Period foreign key until that parent exists. Dedicated PostgreSQL 16 tests prove the full 63-entry ledger and nine-step Student/Talent chain, repeat and late-application idempotency, complete composite-target validity, duplicate-data failure without rewrite or marker, and rollback without partial Student tables. No production data, tenant FK removal, timetable change, deployment, or tis.db change. The M10 results workspace now presents governed rates through privacy-safe gauges and grade/Branch comparisons, carries supported Program/Branch/Grade filters into drill-down navigation, shows exact backend evaluation-period labels in Progress Over Time, and moves secondary totals into compact or disclosed summaries. It does not derive new metrics or encode suppressed values. The Talent Programs and Evaluation UX now uses a compact searchable Program table, a four-step guided setup with joined competency/achievement descriptions, and a standard schedule whose Start Evaluation action sequences existing revision-guarded Plan/Period/Cycle preview and open contracts. Evaluation Plan manage/govern permissions now reach the browser payload. Following real Owner visual acceptance, the shared Talent context filter now auto-applies a selection change (debounced) instead of requiring a separate "Apply context" click, and the primary Talent nav collapses the analytics-family link list into one "Results & Analytics" entry instead of duplicating the existing analytics sub-nav. The Evaluation Schedule free-text-naming and no-internal-lifecycle-copy behavior and the compact, not-permanently-expanded Programs table were re-verified (not re-implemented) with a fresh rendered-output regression, and stale "Baseline/Term 1/Term 2/Final" and "Save Schedule" KMS prose describing an earlier, since-superseded state was corrected across AI_PROJECT_CONTEXT.md, PROJECT_STATE.md, TIS_MASTER_CONTEXT.md, and USER_AND_SYSTEM_FLOWS.md. The Organization Overview "Analytics unavailable" local-environment condition was diagnosed read-only (DATABASE_URL must resolve to the exact sanctioned .local_test_data/talent_local_test.db path; an unset DATABASE_URL falls back to tis.db by design) with no code change, confirming existing fail-closed behavior rather than a defect. No backend authority, tenant isolation, frozen history, schema, pricing, AI, analytics computation, privacy, entitlement, or timetable behavior changed. Following further Owner visual-acceptance direction, the normal user-facing "Review Candidates" surface is now labeled "Talent Review" (nav entry, breadcrumb, Student Profile Talent tab, and in-page notifications); the backend ReviewCandidate model, `/api/talent/review-candidates` routes, and `talent_review_candidates.*` permission keys are unchanged deterministic/audit identifiers, not renamed. The Talent Review list now renders as a compact table (Student, Program, Grade, Section, Evaluation, Result, Review status, Identification status, Action) instead of one large card per Student, with full per-Student detail (Official Identification decision form included) opening on a dedicated `review_id` drill-down rather than inline in the list. The Evaluation Student list is now a compact table with a state-driven action label: Not started shows "Start Assessment", an assessment with status `in_progress` shows "Continue Assessment", and any other recorded status (completed/incomplete/insufficient evidence) shows "View Assessment". In the Students list, the normal "Active" lifecycle status (Student lifecycle, not Talent status) is de-emphasized to plain muted text instead of a colored badge, since it is the expected state for a normal attending Student; "Inactive" keeps its visible chip as a real exception, and Status remains an available filter/column. Two items from the same Owner direction were investigated and explicitly deferred, not implemented: (1) Program Identity/Logo (new capability - a Program logo/branding slot) was not built in this pass because it requires a schema/model change (a new `TalentProgram` logo field) and new upload routes, which exceeds this task's safe bounded scope; the current `TalentProgram` model confirms Program ownership is organization-scoped (`school_group_id`, no `branch_id`) with no existing branch-level override, and the existing `branding_storage.py` organization/branch logo upload pattern (including safe SVG sanitization) is the correct pattern to reuse if this is built later - no branch-level Program logo override exists or was added. (2) Talent's own Grade/Section pickers (the shared Talent context filter, Program setup, Evaluation assignment, Talent Review filters) do not yet derive from Planning; the shared context filter's Grade picker in `static/js/talent.js` still renders a hardcoded KG+1-12 list rather than the Planning-configured subset used by the Students module - confirmed as a real, currently-open gap and not fixed in this pass. Program Identity, Planning-driven Grade/Section selection with fail-closed direct-write validation, compact cross-surface logo rendering, scroll preservation, and in-progress competency-result clearing are now implemented; this supersedes the earlier deferred-status sentences in the same declaration. A further Owner-flagged analytics-presentation pass adds a single, largest-on-page radial gauge to the Organization Overview answering "how many Students are talented", sourced only from the existing identified_of_eligible M10 metric's organization_total cell and gated by the existing talent_official_identifications.view permission; this confirms Official Identification (a separate, permanent human decision) as the authoritative "talented" signal, kept visually and textually distinct from the rubric level and from Meets Program Criteria/Review-Candidate membership. It also wires the previously implemented but UI-unused M9 rubric-distribution route into the Organization Overview (shown only when one Program is selected) via a new shared, order-derived (never magnitude-derived) rubric-level visual reused from a single helper rather than duplicated per surface, safe for any Program's label set/level count and for a privacy-protected level. No analytics service, provider, privacy threshold, suppression rule, permission, tenant, schema, migration, or data behavior changed. Per direct Owner instruction, Student Learning Style moves from deferred/out-of-scope to active V1 scope: ADR 0031 records the governed contract (optional single-select Student-domain field, four fixed values - Visual, Auditory, Read/Write, Kinesthetic - reuses the existing students.edit permission, zero effect on any Talent scoring/eligibility/Official Identification computation, aggregate analytics only under the existing Talent privacy/suppression contract, multi-style explicitly out of scope for V1) and PROJECT_STATE.md records the same decision as a governance-authorization entry, not a completion record. The historical M7-M10 milestone entries describing Learning Style as out of scope remain unchanged and accurate as of the dates they describe. Implementation (schema/migration, API, UI, analytics, tests) is tracked separately. Following that recorded governance decision, this pass implements the ADR 0031 V1 contract: a nullable single-select `Student.learning_style` column (migration 20260910_002_student_learning_style_v1, purely additive, no rewrite; a NOT VALID/VALIDATE PostgreSQL CHECK constraint mirrors the fresh-schema SQLAlchemy CheckConstraint), restricted server-side in student_academic_service.py to exactly Visual/Auditory/Read-Write/Kinesthetic with any other value (including case variants) rejected at the API layer regardless of UI restriction. Added to Student create/edit (a shared templates/_learning_style.html macro reused by student_form.html and student_profile.html, compact icon+label selector using existing design tokens, unset renders as neutral "Not specified") and to Student Profile display (Overview and the Talent tab, shown as explicit learner context, never a Talent signal). Editing reuses the existing students.edit permission; no new permission was introduced. Added a new lightweight Students-domain module (student_learning_style_analytics.py) and route (GET /api/students/analytics/learning-style-distribution) plus a compact Students-list panel for Branch/Organization Learning Style distribution, reusing the existing Branch/Grade/Section filters and the governed Talent privacy/suppression contract (talent_analytics_privacy.py's Cell/Group/apply_primary_privacy/run_complementary_suppression, the same "one Group, total = sum(children)" shape the existing /rubric-distribution route already uses) rather than a new or weaker rule; it fails closed (503 analytics_unavailable / hidden panel) when no privacy policy is configured. This was deliberately kept out of the existing Talent B7 organization-analytics closure because its population (current effective placement in the actor's authorized scope) is never Program/Cycle-scoped, unlike every existing Talent analytics metric. Regression tests assert no Talent scoring/Program-Criteria/Review/Official-Identification module reads learning_style (source-scan test across talent_program_service.py, talent_analytics_service.py, talent_org_intelligence_service.py, talent_analytics_privacy.py, and the Talent routers). The Talent Review/Assessment operational drill-down in static/js/talent-operations.js was deliberately left unextended: its backend context payload lives in routers/talent_review_candidates.py and routers/talent_assessments.py, both already carrying substantial unrelated uncommitted changes from separate concurrent work, so combining edits there was judged unsafe rather than a decision about the feature itself. Icon coverage gap confirmed and reported (not invented): templates/_app_icons.html has no ear/sound/speaker glyph, so Auditory renders with the text label only; Visual reuses "eye", Read/Write reuses "exam", Kinesthetic reuses "activity" (already used elsewhere for "Allocated Hours", disambiguated by the always-present text label). No Talent scoring, eligibility, Official Identification, permission, tenant/branch boundary, unrelated Talent file (routers/talent_assessment_cycles.py, routers/talent_assessments.py, routers/talent_programs.py, routers/talent_review_candidates.py, saas/*, main.py, ui_shell.py, or any other already-dirty pre-existing change in this working tree), or tis.db change. A separate delegated bug-fix task investigated an Owner report that the Student Assessments page showed only "Saved assessments"/"No assessments saved in this context yet." after starting an Evaluation Period, with no Student population table. Root cause confirmed live against the sanctioned .local_test_data/talent_local_test.db (reseeded via the guarded scripts/manage_local_talent_test_db.py reseed --confirm workflow to pick up the current schema): Start Evaluation already correctly creates/links the Cycle, freezes the population, and the backend already returns the correct frozen population and Cycle rows for the matching Program/Academic Year (proven by direct authenticated API calls). The defect was purely in static/js/talent-operations.js's assessments render path: the "Students in this evaluation" table was gated behind an exact cycle_id URL query parameter that ordinary navigation (the primary Talent nav, which by design never threads cycle_id) never supplies, so a correctly-opened, correctly-populated evaluation stayed hidden behind an easy-to-miss "Open evaluation students" card, and a Program with literally zero Cycles collapsed to an indistinguishable empty state. The fix auto-selects the one Open Cycle for the current Program/Academic Year context when no explicit cycle_id is present (multiple Open Cycles or no Program selected are left as an explicit card-based choice, never guessed), and adds a distinct, honest "No Evaluation Period is open for this Program in this Academic Year yet." message with a direct link to the Evaluation Plan for the true zero-Cycle case, kept visually and textually separate from the existing zero-population and zero-saved-assessment messages. This is presentation/routing-only: no schema, migration, permission, API contract, Cycle-open/population-freeze semantics, Start/Continue/View Assessment action mapping, or tis.db change, so it carries no additional KMS documentation impact beyond this declaration; tests/talent_operations.test.cjs gained five new regression cases and the existing suite (14 total) plus 51 scoped backend Talent pytest cases pass unchanged. A further delegated investigation into an Owner-reported screenshot bug ("Edit Details shows the Learning Style label but no selector controls render") found the defect is not reproducible in the current working tree: real Jinja-rendered HTML captured via a live FastAPI TestClient for both GET /students/new and GET /students/{id}?section=overview shows `templates/_learning_style.html`'s `learning_style_field` macro correctly emitting all four approved values plus "Not specified" as `stu-ls-option` radio pills, with the Student's currently saved value correctly marked `is-selected`/`checked` on reopen (verified against a `Student.learning_style == "Kinesthetic"` fixture); `routers/students_ui.py` passes `learning_style_options`/`LEARNING_STYLE_OPTIONS` into every relevant render call (`/students/new` GET+POST-error, `/students/{id}` profile), `static/css/students.css`'s `.stu-ls-options`/`.stu-ls-option` selectors match the macro's emitted class names exactly (no mismatch), and no JS file touches the Students Learning Style control. No template, router, service, or CSS code was changed as a result, since none reproduces a defect; the most likely explanations for the Owner's screenshot are a stale browser cache or a dev server not yet reloaded after the immediately-prior implementation pass, not a code defect. Two focused rendered-HTML regression tests were added to `tests/test_student_learning_style_v1.py` (asserting the Add Student selector renders with none of the four values pre-selected, and the Edit Details selector renders with exactly the Student's current saved value pre-checked) to close the real pre-existing gap that prior Learning Style V1 tests only asserted service/API-layer behavior, never actual selector-control HTML output. No schema, migration, permission, tenant, Talent-scoring, privacy, or production-code behavior changed.
