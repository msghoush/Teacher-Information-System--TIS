knowledge_impact: no
summary: "P0 bug fix (Owner-reproduced): static/js/talent-operations.js gated the Student Assessments population read on cycle.status !== 'draft', so a Draft Talent Assessment Cycle never showed its eligible Students and its card only linked with the misleading label \"Open evaluation students\" (no real action). Fixed by fetching the already-existing, already-ADR-0033-authorized GET /api/talent/assessment-cycles/{id}/population/preview for a Draft Cycle, rendering its eligible Students with a distinct \"Eligible - evaluation not opened yet\" status (never conflated with the Open Cycle's \"Not started\" state), and adding a governed \"Open Evaluation\" button (shown only when can('talent_assessment_cycles.govern'), the same permission key and expected_revision optimistic-concurrency pattern already used by every other Cycle lifecycle mutation, including the equivalent Start Evaluation action in static/js/talent-evaluation-workspace.js) that calls the already-existing POST .../open route and reloads. The Draft-cycle card label now reads \"View eligible Students\" instead of the misleading \"Open evaluation students\". No new route, permission, schema, or lifecycle rule was added - this only wires the frontend to the preview/open contract ADR 0033 and the M4 Cycle lifecycle already authorize and the backend already implements and tests (routers/talent_assessment_cycles.py, talent_assessment_cycle_service.py, tests/test_talent_assessment_cycle_frozen_population.py). Regression coverage added in tests/talent_operations.test.cjs for the Draft preview render, permission-gated Open Evaluation visibility, the exact open-route call with expected_revision, and the preview-to-open-cycle state transition."
affected_areas:
  - student-assessments-ui-draft-cycle-preview
