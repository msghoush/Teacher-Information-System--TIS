summary: "Talent & Potential M4: implements the complete backend-authoritative Evaluation Progress contract for Student, Branch, and Organization scope, plus the seven approved Branch comparison metrics and the Learning Style Branch aggregate, per new ADR 0044. New files: talent_evaluation_progress_service.py (core logic: resolve_active_periods implementing the confirmed active/opened predicate TalentPlannedEvaluationPeriod.status=='planned' AND linked TalentAssessmentCycle.status IN ('open','closed'); build_student_progress; build_branch_progress/build_organization_progress with a shared privacy-gated _period_branch_results/_privacy_safe_branch_mean_group helper; learning_style_branch_aggregate; branch_comparison_metric bounded dispatcher for exactly seven metrics) and routers/talent_evaluation_progress.py (four GET routes under /api/talent/evaluation-progress, registered in main.py alongside the other Talent routers - no new permission, reuses talent_learner_profiles.view for the single-Student route and talent_analytics.view plus talent_review_candidates.view/talent_official_identifications.view for Branch/Organization/comparison routes exactly as M9 already does). Two owner-ratified decisions recorded in ADR 0044: (1) Framework comparability - Evaluation Periods combine into one Overall Result only when every contributing active Period shares one identical governed framework_version_id, else every Period returns individually with a null combined Overall and reason_code=framework_changed, never a cross-framework delta/equivalence; (2) single-Student disclosure - an individually authorized Student's own Evaluation Progress is governed by normal Student/Talent authorization and frozen-historical-Branch scope (mirroring talent_learner_profile_service.build_learner_profile exactly), never aggregate cohort-size privacy suppression - that route has no privacy-policy dependency at all by construction. BranchPeriodResult/OrganizationPeriodResult are the direct mean of valid governed Student normalized_percent (ADR 0037) results via frozen TalentAssessmentCyclePopulationMember.branch_id attribution; OrganizationPeriodResult is proven (dedicated unequal-Branch-size test) to never be average(BranchPeriodResult). Every Branch/Organization aggregate and the Learning Style aggregate reuse ONLY the M9 generic Cell/Group/apply_primary_privacy/run_complementary_suppression primitives (talent_analytics_privacy.py) - the frozen 14-value M10 MetricCode enum in talent_org_intelligence_contract.py is unmodified. Four of the seven Branch comparison metrics (assessment_completion, assessments_started, meets_program_criteria, officially_confirmed) reuse existing M9 raw_coverage_by_dimension/raw_candidate_by_dimension/raw_identification_by_dimension/build_breakdown_group providers unchanged, inheriting one disclosed non-blocking characteristic (an all-zero cohort's total may label suppressed instead of no_data - no raw value ever leaks either way); the two new aggregates (Period Result, Learning Style) explicitly avoid this by converting a falsy total to None before privacy evaluation. No schema, migration, new permission, or frontend change; the existing client-side Review-Candidate average in talent-operations.js is untouched. A required second-pass adversarial privacy/reconstruction review across 16 specified risk categories (suppressed-Period reconstruction, complementary-suppression failures, sparse-matrix omission, privacy call ordering, hidden raw values, numerator/denominator leakage, average-of-Branch-averages, current-placement vs frozen attribution, cross-tenant contamination, Framework-version mixing, Pending-as-zero, null-Learning-Style-as-zero, privacy-provider fail-open, unauthorized single-Student access, M10 registry modification, client arithmetic becoming authoritative) found the implementation clean. New focused coverage in tests/test_talent_evaluation_progress.py (25 tests). Full regression across tests/test_talent_analytics.py, tests/test_talent_organization_*.py, tests/test_talent_org_intelligence_contract.py, tests/test_student_learning_style_*.py, tests/test_student_managed_number_service.py, tests/test_student_tis_number_identifier_foundation.py, tests/test_talent_student_assessment_competency_results.py, tests/test_talent_rubric_kpi_candidate_policy.py, tests/test_permission_registry_matrix.py, tests/test_permission_surface_consistency.py passes with exactly the same 3 pre-existing failures (tests/test_talent_organization_student_drill.py::test_query_family_is_bounded_and_not_row_proportional, tests/test_student_learning_style_v1.py::test_html_students_page_shows_one_panel_level_protected_message_when_every_category_is_suppressed, tests/test_talent_rubric_kpi_candidate_policy.py::test_removing_referenced_framework_competency_is_a_clean_business_rule_rejection) directly confirmed present and unchanged on unmodified dev HEAD 96dd454 before this task via an explicit before/after comparison; none are newly introduced or newly fixed by M4."
