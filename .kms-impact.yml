summary: "Whole permission-system consistency closure: removed all request-independent/cached permission resolution so a role-permission grant/revoke/re-grant reliably reflects on the next read for every registered permission (not only subjects.view); fixed several independent stale/incorrect permission-gate defects found by the full-registry audit (Users role-assignment/permission-management helpers, Observations create/edit/delete/unlock plus a distinct create-by-observation-type gap, System Configuration Qualifications routes gated by entirely wrong keys, Branch update/delete and Academic Year set/open missing per-field and SchoolGroup-scope checks, Notifications and Branding logo mutation routes missing dedicated server-side permission checks); added a non-destructive migration installing partial-unique constraints on `role_permissions` and an assignability re-validation in `user_permission_service.apply_user_override`."
