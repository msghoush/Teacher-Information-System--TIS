knowledge_impact: yes
summary: "M5 implementation (per governing ADR 0045, already committed): adds the single shared, authoritative, server-side presentation helper academic_grade.format_section_display(workspace_uuid, grade_level, section_name) -> str, activated exclusively on exact SchoolGroup.workspace_uuid equality to the ADR 0045-authorized 72e52eb2-3844-447b-92a8-c55015f73257 (never name/domain/email/Branch label), rendering {grade_number}.{section_ordinal} (Section A=1...Z=26) and falling back to the unchanged canonical section_name for every other workspace and every non-deterministic Grade/Section. Wired as a bounded, additive section_display projection (canonical grade_level/section_name always preserved unchanged alongside it, never mutated or replaced) into: Students UI current placement and placement history (routers/students_ui.py::_placement_view), the Academic Placement Section selector (GET /students/sections, static/js/students.js), the Students list Grade/Section filter dropdown, the Talent frozen historical Learner Profile context (talent_learner_profile_service.py::build_learner_profile's frozen_context, sourced from the frozen TalentAssessmentCyclePopulationMember Grade/Section, never the Student's current placement - verified by a dedicated regression test that diverges the two), the Talent Student Assessment eligible-students roster (GET /api/talent/assessment-cycles/{id}/eligible-students), and the Talent Results/Analytics Grade/Section filter (GET /api/talent/programs/planning-sections). Organization-analytics Grade/Section grouping identity is explicitly out of scope and unchanged, per ADR 0045's analytics-grouping-identity constraint. No schema, migration, or new permission. Focused tests added: tests/test_academic_grade_section_display.py (pure formatter/ordinal/fallback edge cases) and tests/test_al_andalus_section_display.py (cross-surface wiring: exact-UUID activation, a different-UUID row sharing the exact organization name, workspace-rename stability, other-tenant isolation, canonical-value-unchanged/no-mutation checks, frozen-vs-current-placement divergence). Regression sweep across Students UI / Talent Learner Profile / Talent Assessment Cycle / Talent Program / Talent UI test suites confirmed only 4 pre-existing failures in tests/test_talent_assessment_cycle_frozen_population.py (directly re-verified present on unmodified dev HEAD via git stash before/after comparison, unrelated to Grade gating or this change) - not the 3 previously documented at an earlier milestone; two additive-field assertion updates were made to pre-existing tests (test_students_ui.py, test_talent_program_logo.py) to reflect the new additive section_display field, not a behavior change. Prior M1-M4 KMS context and ADR 0045's own authorization rationale are unchanged; this entry records implementation completion only, in docs/PROJECT_STATE.md and docs/CHANGE_HISTORY.md, referencing ADR 0045."
