knowledge_impact: yes
summary: "Implemented the previously-deferred ADR 0020 promo-to-promo transfer capability: a new Platform Console-only 'Replace / Extend Promotional Access' workflow (ADR 0041) atomically supersedes an organization's active PromoGrant with a fresh grant redeemed against a different, currently valid PromoCode. saas/promo_redemption_service.py gained preview_grant_replacement/replace_promo_grant, reusing the existing _validate_promo_definition gate and the same 'end old evidence, create new evidence, repoint the tenant link, one nested transaction' shape ADR 0024 already established for promo-to-paid conversion. The old PromoGrant becomes status=superseded (retained) and the new grant's supersedes_grant_id points back at it, matching the existing PromoCode.supersedes_promo_code_id convention. Existing branches/users/teachers are never touched (no Branch/User/Teacher row is created, modified, or deleted) - only PromoGrant/WorkspaceEntitlement/TenantProvisioningLink/PromoGrantBranchAssignment commercial evidence changes. No schema or migration change was needed (supersedes_grant_id and the 'superseded' status already existed unused). Two new saas/router.py admin routes and one new confirm template add a server-rendered old-vs-new-limits confirmation step, reusing the existing platform-only promo_codes.manage authorization. Regression coverage: tests/test_promo_redemption.py::PromoGrantReplacementTests (6 tests) and tests/test_promo_code_management.py::PromoGrantReplacementRouteTests (2 route tests). Continuation task added tests/test_promo_redemption.py::PromoRedemptionPostgreSQLTests::test_replace_promo_grant_is_atomic_under_postgresql and ::test_replace_promo_grant_rollback_preserves_original_state_under_postgresql, following this file's existing TIS_TEST_POSTGRESQL_URL skip-marked class convention exactly (no new DB-testing framework); both auto-skip in this environment (no TIS_TEST_POSTGRESQL_URL, no local PostgreSQL listener). It also corrected an ADR-governance defect from the prior uncommitted pass: ADR 0020's historical Consequences bullet ('Promo renewal, transfer, communication, automated expiry jobs, and active-promo early conversion remain deferred') had been reworded in place to delete 'transfer', erasing the historical decision record. Restored the original bullet verbatim and added a new, separate 'Amended by ADR 0041' bullet immediately after it (plus an amends: frontmatter note on ADR 0041) so the historical record is preserved and the forward pointer is additive only. No code behavior changed in this continuation task."
