summary: "Integration task: cherry-picked the isolated M15 feature branch (m15-student-integrity-roster, tip 20366e0, branched off the M13 tip 50c049f) onto M14 dev (tip c5f67bb) so both milestones' KMS truth and code are present together on dev; no new product behavior was authored by this integration task itself beyond conflict resolution and regenerating the derived KMS artifacts. M14 (Students + Talent & Potential, already on dev before this integration): owner-directed correction milestone implementing two corrections identified in a prior read-only Post-M13 Correction Review. (1) Learning Style is ONE categorical selection per Student, extended from four to eight values (Visual, Auditory, Read/Write, Kinesthetic, Verbal, Non-verbal, Quantitative, Spatial) - the four added values were previously, mistakenly, modeled as an independent four-dimension percentage profile (learning_style_verbal_percentage/non_verbal_percentage/quantitative_percentage/spatial_percentage, ADR 0042/M1-M3). Student create/edit now shows one Learning Style selector (eight values plus Not assigned); the Student profile shows the one selected value instead of four percentage bars; Talent Student context reads the current categorical value directly (zero effect on rubric/Assessment/Overall Result/Evaluation Progress/classification/Candidate-Identification). (2) 'Percentage' means population/aggregate distribution, never a per-Student dimension percentage - the four learning_style_*_percentage columns are operationally deprecated (no longer accepted as create/update input, no longer displayed, no longer read as Learning Style authority anywhere); existing stored values are preserved completely untouched. student_learning_style_analytics.py covers all eight categorical values plus an Unassigned bucket. The M4/M10 talent_evaluation_progress_service.py 'learning_style' Branch-comparison metric is removed from APPROVED_BRANCH_METRICS (six metrics remain). One forward-only migration (20260923_002_student_learning_style_eight_values) widens ck_students_learning_style from four to eight values on PostgreSQL; SQLite relies on the service-layer guard for an already-migrated database; a fresh SQLite database gets the widened constraint directly from models.py. No column added or dropped, no row rewritten. ADR 0031, ADR 0042, and ADR 0044 are amended with M14 sections. M15 (this integration's incoming branch): implements two owner corrections, independent of and non-overlapping with M14's Learning Style scope. (1) Student integrity/Talent visibility - independently verified force_delete_student_history already cascades every Student-owned Talent table child-before-parent and that Talent current-operational surfaces INNER-join Student, so a permanently deleted Student cannot appear anywhere in Talent & Potential; the owner's ~9-vs-~13 observation is a population-scope difference (Branch-scoped current Students list vs frozen multi-Branch Talent membership plus the status-agnostic eligible-students roster per ADR 0039), not a deletion defect, so no schema/cascade change was needed or made; locked by tests/test_student_delete_talent_visibility.py (new). (2) Student roster round-trip (student_roster_service.py, static/js/students-roster.js, static/css/students.css) - section_display is now accepted-but-ignored on import (display-only, never identity; canonical section remains identity per ADR 0045), the STD prefix is normalized back to the bare ten-digit value on import, unchanged exported rows classify deterministic NO_CHANGE, new rows classify CREATE, mutated existing rows stay a blocked student_id_conflict (create-only preserved, never silently updated), and export gains bold/frozen-header/autofilter formatting; extended in tests/test_student_roster_import_export.py. M15's code changes do not touch models.py, db_migrations.py, student_academic_service.py's Learning Style validator, student_learning_style_analytics.py, routers/students.py or routers/students_ui.py's Learning Style fields, templates/_learning_style.html/student_form.html/student_profile.html, or talent_evaluation_progress_service.py - M14's eight-value categorical Learning Style model is completely unaffected by this integration, verified by inspecting the cherry-picked diff and by re-running the M14 Learning Style regression suites after integration. docs/PROJECT_STATE.md, docs/TIS_MASTER_CONTEXT.md, docs/AI_PROJECT_CONTEXT.md, docs/engineering/TIS_MODULE_MAP.md, and docs/engineering/USER_AND_SYSTEM_FLOWS.md now each carry both the M14 section (auto-merged cleanly, non-overlapping insertion point) and the M15 section (auto-merged cleanly, non-overlapping insertion point) from this cherry-pick. docs/CHANGE_HISTORY.md and this file (.kms-impact.yml) had direct textual conflicts (both milestones edited the same top-of-file summary/entry point) and were manually reconciled to keep both milestones' dated entries in full, per the project's additive-dated-section convention - no historical content from either milestone was discarded. The two generated KMS artifacts (static/docs/TIS_Project_Reference_Booklet.pdf, static/docs/docs_manifest.json) were NOT hand-merged from either branch's pre-generated version; both were regenerated fresh from the final integrated source tree via scripts/kms.py sync after all source-level conflicts were resolved. tis.db is untouched by this integration task (verified byte-identical via SHA-256 before and after). Does not itself authorize, perform, or claim any deployment; Web Service and the separate tis-timetable-workflow revision are unaffected (no timetable-domain code touched). M16, M17, and M18 work remains explicitly out of scope and was not touched by this integration."
