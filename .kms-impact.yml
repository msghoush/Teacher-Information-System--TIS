knowledge_impact: yes
summary: "Focused Talent & Potential Owner-acceptance-testing correction pass on top of pushed commit a173555. No architectural or eligibility-gate change; this is a UI/UX correction pass over the already-governed ADR 0039 Competency+KPI+Level model. Changes: (1) fixed a genuine Competency-builder rendering bug in rubricGradeSections (talent-program-workspace.js) where a Competency with no explicit grade_level on a genuinely new draft Framework (framework.in_use_by_assessments === false) never matched any Grade section and so never rendered at all - meaning its Delete Competency action was invisible not by permission design but because the row itself never rendered; the fix distinguishes this from the pre-existing, still-preserved rule that a no-grade Competency on an ALREADY-USED Framework (in_use_by_assessments === true) is legacy/pre-migration data and must stay hidden from new-Grade authoring. (2) Competency cards in the builder are now individually collapsible via native <details>/<summary> disclosure (accessible, keyboard-operable, no default full expansion), showing a compact header (name + 'N KPI / N Levels' count) before the Owner opts to expand one. (3) Unified the Delete Competency confirmation text across both the direct-delete and version-safe (clone-then-delete) paths to a single Owner-approved message that never exposes Framework-version/immutability language to the Owner. (4) Added a 'Back to Students' action to the opened Student Assessment editor (talent-operations.js) that returns to the assessments list view (never the Talent landing page) preserving academic_year_id, program_id, and cycle_id (preferring evaluation_context_cycle_id) so the Owner returns to the same Evaluation/Program context. (5) Two explicit capitalization corrections to Title Case per the Owner's UI capitalization standard: '<N> Competency/Competencies' and '<N> Level/Levels' counters in the Competency/Grade rubric summaries, the 'KPI Overview' section heading, and the Student Assessments roster's 'Assessment Status' column header - explanatory sentences were deliberately left in normal sentence case. (6) The Owner-supplied Ghars sidebar symbol-only asset (talent-ghars-symbol.png) referenced in this correction request was not actually available in this environment (confirmed via full filesystem search) - the sidebar branding change from the prior corrective pass (Ghars symbol-and-text, no oversized row) remains unchanged and still references the existing static/img/talent-ghars-logo.svg asset; this one item is explicitly deferred pending the actual file. No backend Python files changed in this pass. Zero new test regressions: confirmed via before/after git-stash comparison across tests/talent_program_workspace.test.cjs (41 pass/8 fail baseline -> 44 pass/7 fail, with the pre-existing 'immutable assessment setup...' failure now fixed as a side effect and the remaining 7 unrelated pre-existing failures identical), tests/talent_operations.test.cjs (23 pass/3 fail baseline -> 24 pass/3 fail, same 3 pre-existing failures), tests/talent_evaluation_workspace.test.cjs + talent_results_experience.test.cjs + talent_rubric_visual.test.cjs + talent_ui.test.cjs (59 pass/2 fail, unchanged, unrelated to this pass), and the focused Python suite (133 pass/4 fail, all 4 pre-existing and confirmed identical with git stash, unrelated - no Python files were touched this pass)."
