summary: "UI interaction-pattern correction on top of pushed commit 9f763ed: Edit/Delete for Competency, KPI, and Level items in the Program Competency/KPI/Level builder (static/js/talent-program-workspace.js) are now compact icon-only buttons (pencil = Edit, trash = Delete) beside each item, replacing visible action text such as 'Edit Competency'/'Delete Competency'/'Edit KPI'/'Delete KPI'/'Edit Level'/'Delete Level'. Added a shared iconButton() helper producing a real <button> with an accessible aria-label and matching title naming the exact item affected (e.g. 'Delete Mental Calculation', 'Edit Mental Calculation level Beginning'), full keyboard focus (inherits the existing workspace-wide :focus-visible outline), and a >=36px hit target (.tp-icon-btn CSS). Applied to both the primary Grade->Competency->KPI->Level accordion (rubricGradeSections) and the older parallel flat-table 'What we assess' wizard (competencyRows/levelRows/descriptor rows/rubric edit/remove-kpi) so the pattern is consistent everywhere these actions are reachable. Also added an Edit action to the Competency header in the accordion (previously only Delete existed there) using the existing member-name/description PATCH capability already used elsewhere - no new backend behavior, only exposing an existing capability in this view. Add actions (+ Add Competency, + Add KPI, + Add Level, Copy Levels From...) are unchanged and remain visible text in their existing structural positions (Grade section level, inside a Competency, inside a KPI) - this pass does not move or restructure any Add action. No hierarchy, CRUD behavior, or eligibility-gate change. No backend Python files touched. Zero new test regressions: tests/talent_program_workspace.test.cjs went from 44 pass/7 fail to 45 pass/7 fail (one new dedicated icon-pattern regression test added and passing; the same 7 unrelated pre-existing failures remain identical), and the remaining Talent Node suites (talent_operations/talent_evaluation_workspace/talent_results_experience/talent_rubric_visual/talent_ui) are unchanged at 83 pass/5 fail with the same 5 pre-existing failures, confirmed via git-stash before/after comparison."
