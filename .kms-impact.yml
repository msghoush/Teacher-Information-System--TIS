knowledge_impact: yes
summary: "Phase 3 whole-application permission qualification. Audited all 175 registered permission keys (26 groups), the 468-route table and every nav module against the single canonical effective permission result (auth.get_allowed_permission_keys); ADR 0040 precedence, storage, registry and role/user services are unchanged, with no schema change, migration, new key, or second resolver. Final registry classification, machine-checked by tests/test_permission_registry_matrix.py: 143 active-enforced, 14 platform-only enforced, 5 alias/composite, 13 dormant/reserved, 0 unresolved. Re-verification corrected stale KMS dispositions: planning.import and planning.export (no import/export route exists), observations.submit (no code evaluates it) and dashboard.view_all_schools (denial-label only) are dormant. tests/test_permission_route_coverage.py enumerates every route (136 middleware rules, 182 in-handler guards, 10 helper guards, 34 platform-identity, 65 SaaS-account-session, 41 reviewed allowlist, 0 uncovered) and proves every middleware rule denies an empty effective set at runtime (resolver stubbed); the route test is structural (guard-named calls in the handler closure), not a full authenticated HTTP sweep. One defect fixed test-first: POST /scope/organization accepted any platform user by identity alone although its denial cited system_owner.switch_all_schools, so a Platform Developer with the all-school capability withheld could still select an organization; it now also requires the canonical _can_manage_all_school_scopes helper (Owner unaffected). Seven unused duplicate role-policy reader helpers (_get_role_permission_rows in auth/main/users/ui_shell and _get_allowed_permission_keys in main/users/ui_shell) were deleted; they had no callers. tests/test_permission_dangerous_patterns.py classifies every role-name/identity/raw-policy-query/form-SchoolGroup/cache pattern hit with exact per-file counts (20 helper, 15 identity, 5 legacy, 0 escalation, 0 bypass; the observation role-User rule is a documented restrictive compatibility rule). tests/test_permission_surface_consistency.py covers sidebar/Dashboard/route consistency for every nav module including multi-key Talent and System Configuration gates and the Talent sub-nav, mutation families, Allow/Deny/Allow freshness for Role Package/School Override/User Exception, role change with retained exceptions, tenant isolation and platform-only protection on fresh sessions; tests/test_permission_surfaces_accessibility.py checks the permission-management templates at source level. Final hardening pass: the ai.use matrix evidence is now an AST-verified constant-to-evaluator chain into saas/ai_entitlement_service.py plus a runtime allow/deny/restore test in tests/test_ai_entitlement_service.py; the accessibility test renders the real User Exceptions and School Overrides pages and asserts Allow/Deny as visible text; the diagnostic CLI was re-qualified (tests/test_diagnose_user_permissions.py 6 of 6 plus manual not_found and database_unavailable runs); ADR 0040 historical helper names are addressed in the Phase 3 review without editing the ADR. Four Owner/product decisions remain open and unresolved (teacher-create field-level enforcement, tenant-toggleable dormant keys, whether role User may author observations, orphan UserPermissionOverride rows on workspace deletion). Web Service only; no Timetable Workflow change. tis.db was not modified (SHA-256 verified identical before and after)."
