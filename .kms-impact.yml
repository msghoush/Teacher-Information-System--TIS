knowledge_impact: yes
summary: "CRITICAL RELEASE BLOCKER fix on top of pushed commit 9942459: root-caused and fixed production SQLAlchemy QueuePool exhaustion (confirmed traceback: 'QueuePool limit of size 5 overflow 10 reached, connection timed out, timeout 30.00'). Root cause: main.py's inactivity_timeout_middleware (a global @app.middleware('http') that runs on every authenticated request across the whole application, not only Talent) opened its own SessionLocal() session and wrapped the entire `await call_next(request)` call inside the same try/finally: db.close() block. This held that connection checked out for the full duration of every request's downstream processing, on top of whatever connection the route handler itself independently acquired via Depends(get_db). Every authenticated request therefore consumed two simultaneous pool connections for its whole lifetime instead of one - not a classic leak (db.close() always ran eventually) but a long-held/duplicated connection held far longer than the four quick, purely-scalar queries (session-user lookup, idle-timeout check, current_user resolution, commercial-access/permission checks) it actually needed. Talent Student Assessments fires ~5 concurrent API requests per page load, so a single page load could require up to 10 simultaneous connections purely from this doubling; against the unconfigured SQLAlchemy default QueuePool (pool_size=5, max_overflow=10, pool_timeout=30 - confirmed unset in database.py's create_engine call, matching the traceback's numbers exactly), this exhausted the pool under light concurrent traffic, explaining why Student Assessments failed first, why other pages then hung (the pool was globally exhausted for the whole app, not just Talent), and why a Render restart temporarily fixed it (restart empties/resets the pool; the underlying doubling pattern was unchanged and would recur). Investigated and ruled out: no additional independent SessionLocal()/sessionmaker()/engine.connect() sources exist in the Talent service/router layer (talent_program_service.py, talent_assessment_cycle_service.py, talent_student_assessment_service.py, routers/talent_programs.py, routers/talent_assessments.py, routers/talent_assessment_cycles.py all rely exclusively on the injected Depends(get_db) session); dependencies.py's get_db() canonical dependency correctly implements try/yield/finally: db.close() with no rollback gap since Session.close() safely discards any open transaction; worker/process concurrency is a single uvicorn process per the documented Start Command (uvicorn main:app, no --workers flag), so the observed pool numbers are exactly the single-process SQLAlchemy defaults, not a worker-multiplication effect; no other request-scoped middleware (audit_logging_middleware) opens a database session. No Grade gate or annual Program-configuration enablement gate was reintroduced - talent_assessment_cycle_service.current_placements_for_assessment and talent_student_assessment_service._current_placement_for_assessment are unchanged. Fix: restructured inactivity_timeout_middleware so its SQLAlchemy session is opened, used for the auth/idle-timeout/commercial-access/route-permission checks, and closed (via the same try/finally pattern) entirely BEFORE `call_next` is ever awaited; downstream `call_next` and cookie-setting now run after the session is already closed. Behavior-preserving: every existing early-return branch (missing/inactive user, idle timeout, commercial-access denial, permission denial) is unchanged in outcome, only restructured to route through one closing point ahead of `call_next` instead of returning from inside the open session. New regression coverage in tests/test_db_connection_pool_lifecycle.py (8 tests): proves the middleware's session closes before call_next starts (both on success and when call_next or a permission check raises), proves the idle-timeout cookie is still set correctly after the session closes, proves an unauthenticated/exempt request never opens a session at all, and - against a real small SQLAlchemy QueuePool - proves the fixed single-checkout-per-request shape never exceeds pool capacity under concurrency and returns to baseline after repeated sequential requests, while a reconstruction of the old doubled-checkout shape reliably exhausts the same small pool under the same concurrency (positive proof the doubling was real and is now eliminated). Zero new test regressions: full focused Talent Python suite and tests/test_render_startup.py, tests/test_permissions.py, tests/test_platform_access.py all confirmed via git-stash before/after comparison to have identical pre-existing failure sets, unrelated to this change."
