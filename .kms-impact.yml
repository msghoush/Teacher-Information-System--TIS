knowledge_impact: yes
summary: "Students + Talent & Potential M3: implements the ADR 0042-authorized server-side service/API for the four-dimensional Student Learning Style percentage profile (learning_style_verbal_percentage, learning_style_non_verbal_percentage, learning_style_quantitative_percentage, learning_style_spatial_percentage) on top of the M1 schema foundation (no new migration - the four nullable/0-100-CHECK-constrained columns already exist on Student). Added to student_academic_service.py: LEARNING_STYLE_PERCENTAGE_FIELDS (the four column names) and _clean_learning_style_percentage (validates each dimension independently - None is valid, an int 0-100 inclusive is valid including the 0/100 boundaries, bool is explicitly rejected despite being an int subclass, and any other non-int type including a numeric string/float is rejected rather than coerced, since this dict-based JSON body performs no schema-level type coercion elsewhere in this module - no sum-to-100 rule, no derivation from or to the legacy categorical learning_style column). create_student/create_student_with_number gained the four optional keyword parameters (default None, may all be omitted); update_student now independently applies each of the four fields only when its key is present in the caller's **changes (matching the existing partial-update convention already used for the legacy learning_style/first_name/etc. fields on this same PATCH-backed function), so an unspecified dimension is never touched and an explicit null clears it. _student_payload (used for audit before/after snapshots) now includes all four fields, so an update to any dimension participates in the existing StudentAudit append-only trail exactly like every other Student field with no new audit subsystem. Added to routers/students.py: POST /api/students and PATCH /api/students/{student_id} now accept the four fields (existing students.create/students.edit permission gates unchanged - no new permission); GET/POST/PATCH /api/students... responses now expose all four fields via _student_json. The M2 mandatory student_number-on-create contract, the existing students.manage_identifiers-gated student-number route, and every other M1/M2 behavior are unchanged and re-verified by regression. No schema, migration, new permission, or frontend change; the legacy categorical learning_style column/values/single-select nature are completely untouched (no rewrite, no mapping, no automatic conversion). Confirmed by source-scan regression that no Talent scoring/eligibility module (talent_program_service.py, talent_analytics_service.py, talent_org_intelligence_service.py, talent_analytics_privacy.py, talent_student_assessment_service.py, routers/talent_assessments.py, routers/talent_review_candidates.py, routers/talent_assessment_cycles.py, routers/talent_programs.py) reads any of the four fields or the new validator. New focused coverage in tests/test_student_learning_style_four_dimension_api.py (73 tests: independent service-level validation covering null/partial/0/100/no-sum-rule profiles, out-of-range and wrong-type rejection for every field, atomicity on invalid create, partial-update semantics proving one/multiple/null-clearing changes never corrupt sibling dimensions or unspecified fields, legacy-field preservation on both create and update, Student-create API acceptance/omission of all four dimensions with the M2 student_number requirement re-verified intact, Student-update API permission reuse (students.edit denial for Editor role) and cross-tenant denial (404), response serialization proving all four fields with correct null/zero semantics and no dominant-style/total/normalized field, audit participation, and the Talent source-scan regression). Full regression sweep (tests/ filtered to student or talent or permission, excluding the two ortools-dependent Timetable-Workflow-only solver test modules that fail to import in this environment) passes with exactly the same 13 pre-existing failures directly confirmed present and unchanged on unmodified dev HEAD 24bdb06 before this task (verified by an explicit before/after comparison run in this task, not merely cited from a prior note); none are newly introduced or newly fixed by M3."
