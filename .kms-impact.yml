knowledge_impact: yes
summary: Wire the already-documented and already-ADR-0033-authorized open-cycle population reconciliation into the actual GET population read path (it existed as a callable service/route but nothing invoked it, so eligible Students already placed before a synchronization gap stayed invisible in Student Assessments). Also simplify the normal Add Academic Placement form by removing the optional "Until" field (End/Change Placement remain the only way to close/move a placement) and make the placement-overlap validation message explicitly actionable. Separately, a cross-entity Delete/Remove/Disable/End action-semantics audit re-verified Program (ADR 0032), Competency/Rubric-Level (talent_programs.delete, draft-gated), Evaluation Period (talent_evaluation_plans.delete_period, draft-gated), Assessment (no delete route exists at all, either with or without evidence - reported, not built, per explicit scope discipline against inventing a new destructive capability), Student (confirmed no hard-delete route anywhere in the codebase; Activate/Deactivate only), Academic Placement (confirmed End/Change only, no Delete route or UI anywhere), and Educator Input (append-only; view/add/amend permissions only, no delete). The one real, fixed gap: the already-existing, already-ADR-0032-authorized backend-computed Program "delete" capability (talent_programs.py's _with_actions, returned on every /api/talent/programs row) was never actually rendered or wired in the Programs list UI - static/js/talent-program-workspace.js now shows a "Delete" row action only when that row's own backend actions array includes "delete", with the same window.confirm pattern every other destructive action in this module already uses, and surfaces the exact backend detail message (e.g. "This Draft Talent Program has related records (...) and cannot be permanently deleted.") on failure via the existing mutate()/operationApi error path - no new endpoint, permission, schema, or lifecycle rule. Per direct Owner instruction, a narrow Administrator-only Assessment delete capability is now governed via ADR 0034: a TalentStudentAssessment may be permanently deleted only when it has zero competency results, zero Educator Input, zero Review Candidate membership, and zero Official Identification decision (dependent-table list to be re-verified against the schema at implementation time); any Assessment with such evidence remains permanent history, exactly like every other terminal Talent record. This does not authorize deleting Student placement history, Cycle population records, or any Student/Program delete capability beyond ADR 0032. This is a governance-authorization record only; implementation is tracked separately. ADR 0034 implementation (this pass): re-verified against the current models.py schema that TalentStudentCompetencyResult, TalentReviewCandidate, TalentOfficialIdentification, and TalentEducatorInput each carry a direct assessment_id column (Educator Input's is a nullable direct FK), so the delete-eligibility check is four direct-FK existence checks, not an indirect Student+Program+Cycle+Year re-derivation - a simpler and more precise match to ADR 0034's list than the ADR's own caveat anticipated. Added the talent_assessments.delete permission key (additive tuple, no hard-coded role). Added assessment_delete_blockers/can_delete_assessment/delete_assessment to talent_student_assessment_service.py and DELETE /api/talent/assessments/{assessment_id} to routers/talent_assessments.py, reusing the exact tenant-scope (_authorize) and Branch-authorization (_assessment_authorized/_read_assessment) checks every other Assessment mutation route already uses - no new authorization path invented. The route/list/read payloads now carry a real backend-computed actions array ("delete" present only when zero dependent rows exist AND the actor holds the new permission), and static/js/talent-operations.js renders a "Delete" action in the Assessment Records table only when that row's own actions array allows it, using the same window.confirm plus exact-backend-error-surfacing pattern (this file's local on()/action()/feedback() idiom, functionally equivalent to mutate()) already used for Draft Program delete. No migration was needed: TalentAssessmentAudit.action has no CHECK constraint (only resource_type is constrained, and 'student_assessment' was already present) - the new action="delete" audit row uses the existing _audit() helper and existing resource_type="student_assessment" default with no schema change.
