knowledge_impact: yes
summary: "Students + Talent & Potential M2: implements the ADR 0043-deferred TIS Student number create/edit service/API on top of the M1 schema foundation (no new migration - the two M1 partial unique indexes on student_external_identifiers remain the sole concurrency authority). Added to student_academic_service.py: validate_student_number_digits/canonical_student_number (business input is exactly 10 ASCII digits, leading zeros preserved as a string, canonical stored value is server-controlled STD + the 10 digits, never a client-supplied prefix), create_student_with_number (atomically creates a new Student plus its active tis_student_number StudentExternalIdentifier row in one uncommitted transaction so an IntegrityError on the identifier insert - caught and rolled back by the router - leaves no orphan/partial Student), current_student_number (read-only resolver for the current active canonical value, null for a legacy Student), set_student_number (assign-or-replace: replacement marks the old active row inactive - audited replace_retire - and inserts a new active row - audited replace - never mutating the old value, so Student.id is unchanged and the old value stays permanently reserved by the M1 global-uniqueness index), and find_student_number_holder (a bare, unauthenticated school_group_id/student_id lookup used only after a rollback, carrying no name/metadata by itself). add_external_identifier and deactivate_external_identifier now reject the tis_student_number namespace (managed_namespace error) so the generic external-identifier API cannot create or deactivate the managed namespace directly. Added to routers/students.py: POST /api/students now requires student_number for new Students (existing students.create permission, no new permission); a new PUT /api/students/{student_id}/student-number route (existing students.manage_identifiers permission, no new permission key - confirmed already governed in permission_registry.py before use); a canonical student_number field is now exposed on every Student JSON response; and _student_number_conflict_response implements the approved privacy rule - executed only after the failed insert's transaction is rolled back, it discloses student_id/display_name if and only if the conflicting identifier is same-SchoolGroup AND the actor independently holds students.view, and returns one identical generic student_number_unavailable body for every other case (cross-tenant, unauthorized same-tenant, or a retired value), so there is no enumeration oracle and no cross-tenant/retired-vs-foreign distinction leak. The existing HTML /students/new UI creation path and create_student() itself are completely unchanged (Student ID frontend is an explicit non-goal of this milestone); legacy Students without a number remain fully valid and readable. No new migration, no new table, no new permission, and no tis.db change. Three pre-existing tests that created Students via POST /api/students without a student_number were updated to supply one, since this is the intended M2 behavior change: tests/test_student_academic_foundation.py (two call sites, one with an updated audit-event-count/resource_type assertion reflecting the one additional external_identifier/create audit row every managed-number creation now also writes), tests/test_student_learning_style_v1.py (two call sites), and tests/test_permission_surface_consistency.py (one call site, a permission-gating test unrelated to the identity field). New focused coverage: tests/test_student_managed_number_service.py (46 tests covering format validation, atomicity/no-orphan-Student, legacy assignment, replacement mechanics, M1 global/same-tenant/cross-tenant/retired-reuse uniqueness, the IntegrityError race path, all four privacy-classification combinations, students.create/students.manage_identifiers permission gating, cross-tenant denial, the managed-namespace boundary, audit events, and regression for an unrelated namespace plus an existing Academic Placement workflow). Full relevant regression sweep (tests/ filtered to student or talent or permission, excluding the two ortools-dependent Timetable-Workflow-only solver test modules that fail to import in this environment for an unrelated, pre-existing reason) passes except the same 13 failures already present and confirmed pre-existing on unmodified dev HEAD e98214f before this task; none are newly introduced by this task."
