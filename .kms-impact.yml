no_impact_reason: This PR adds a standalone temporary diagnostic script and its static safety test. The script is not imported by runtime application code, runs only when invoked manually in Render Shell, explicitly starts a read-only PostgreSQL transaction, rolls back before exit, performs no migrations, makes no Paddle calls, and changes no application behavior, schema, customer workflow, permissions, or tenant data.
