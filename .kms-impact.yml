knowledge_impact: yes
summary: "M5 implementation (per governing ADR 0045, already committed): adds the single shared, authoritative, server-side presentation helper academic_grade.format_section_display(workspace_uuid, grade_level, section_name) -> str, activated exclusively on exact SchoolGroup.workspace_uuid equality to the ADR 0045-authorized 72e52eb2-3844-447b-92a8-c55015f73257 (never name/domain/email/Branch label), rendering {grade_number}.{section_ordinal} (Section A=1...Z=26) and falling back to the unchanged canonical section_name for every other workspace and every non-deterministic Grade/Section. Wired as a bounded, additive section_display projection (canonical grade_level/section_name always preserved unchanged alongside it, never mutated or replaced) into: Students UI current placement and placement history (routers/students_ui.py::_placement_view), the Academic Placement Section selector (GET /students/sections, static/js/students.js), the Students list Grade/Section filter dropdown, the Talent frozen historical Learner Profile context (talent_learner_profile_service.py::build_learner_profile's frozen_context, sourced from the frozen TalentAssessmentCyclePopulationMember Grade/Section, never the Student's current placement - verified by a dedicated regression test that diverges the two), the Talent Student Assessment eligible-students roster (GET /api/talent/assessment-cycles/{id}/eligible-students), and the Talent Results/Analytics Grade/Section filter (GET /api/talent/programs/planning-sections). Organization-analytics Grade/Section grouping identity is explicitly out of scope and unchanged, per ADR 0045's analytics-grouping-identity constraint. No schema, migration, or new permission. Focused tests added: tests/test_academic_grade_section_display.py (pure formatter/ordinal/fallback edge cases) and tests/test_al_andalus_section_display.py (cross-surface wiring: exact-UUID activation, a different-UUID row sharing the exact organization name, workspace-rename stability, other-tenant isolation, canonical-value-unchanged/no-mutation checks, frozen-vs-current-placement divergence). Regression sweep across Students UI / Talent Learner Profile / Talent Assessment Cycle / Talent Program / Talent UI test suites confirmed only 4 pre-existing failures in tests/test_talent_assessment_cycle_frozen_population.py (directly re-verified present on unmodified dev HEAD via git stash before/after comparison, unrelated to Grade gating or this change) - not the 3 previously documented at an earlier milestone; two additive-field assertion updates were made to pre-existing tests (test_students_ui.py, test_talent_program_logo.py) to reflect the new additive section_display field, not a behavior change. Prior M1-M4 KMS context and ADR 0045's own authorization rationale are unchanged; this entry records implementation completion only, in docs/PROJECT_STATE.md and docs/CHANGE_HISTORY.md, referencing ADR 0045. Follow-up task (same branch, separate bounded change): registers exactly two Owner-approved semantic permission keys, students.import (Import student roster data) and students.export (Export student roster data), in permission_registry.py's students group, following the exact existing students.* naming/grouping/description/ordering convention. Classified dormant/reserved (status D) in tests/test_permission_registry_matrix.py, matching the established teachers.import/teachers.export precedent - no roster import/export route, service, or frontend exists or was added. Neither key was added to DEVELOPER_ONLY_PERMISSION_KEYS, OWNER_ONLY_PERMISSION_KEYS, ADMINISTRATOR_ONLY_PERMISSION_KEYS, LIMITED_READ_ONLY_PERMISSION_KEYS, or _EDITOR_LIKE_PERMISSIONS - no new default-role grant decision was made; each key is Administrator/Editor/User-assignable like the rest of the students group, and is only included in Administrator's default set through the pre-existing, unchanged DEFAULT_ROLE_PERMISSIONS formula (all registered keys minus platform-only). Test matrix updated: ALL_PERMISSION_KEYS count 175->177, dormant (D) count 13->15, plus CLASSIFICATION/DORMANT_REASONS entries for both keys; test_permission_registry_matrix.py's 154 tests, plus test_permission_management.py, test_permission_qualification.py, test_permission_closure_22_keys.py, test_permission_surface_consistency.py, test_permission_route_coverage.py, test_permission_surfaces_accessibility.py, and test_students_ui.py all pass. One pre-existing, unrelated failure (test_permission_dangerous_patterns.py::test_every_dangerous_pattern_hit_is_classified_with_its_exact_count, about saas/promo_redemption_service.py and saas/router.py) was independently reverified present on unmodified dev HEAD via git stash before/after and is not caused by this change. docs/PROJECT_STATE.md gained a new dated entry recording the registration and its scope/no-auto-grant rationale, plus forward-pointer clarifications at the two previously stale 'deferred to later milestones' / 'No Student UI, import/merge... exists yet' passages (history preserved, not rewritten) noting the permission governance prerequisite is now approved while the roster import/export feature itself remains unimplemented (subsequent, separate M6 work). docs/CHANGE_HISTORY.md gained a matching new entry. No schema, migration, route, service logic, or frontend change; tis.db unchanged."
