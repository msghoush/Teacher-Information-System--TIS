no_impact_reason: "Presentation/UI wiring bug fix only. It reuses already-existing, already-ADR-0033-authorized backend routes (population/preview, open) with no changes to any route, service function, permission key, schema, migration, or lifecycle rule; no new ADR or PROJECT_STATE content is warranted for a bug fix that makes an already-documented, already-governed workflow reachable from the UI. Explicit override below because the change touches the Talent Assessment Cycle / Student Assessments workflow area, which is normally treated as a knowledge-impacting path."
