knowledge_impact: yes
summary: "Priority Owner recovery fix on top of pushed commit d0821e6: recovered the governed path for restoring a Talent Program's existing Competencies after Start Editing's old optional 'Copy the current rubric structure' checkbox produced an accidental empty Draft (reported for a Program with approximately 9 configured Competencies), and permanently fixed Start Editing so this can never recur. Investigation found no live Talent data reachable from this environment to operate on directly: the local tis.db has zero talent_* tables (never migrated), and the only reachable Postgres instance (TIS_TEST_POSTGRESQL_URL, a local B11C concurrency-qualification test database) contains only an empty, stale, isolated test schema with no Program rows - so the actual reported incident lives in a deployed environment this session has no direct database access to. What is delivered instead, fully implemented and tested: (1) a new governed service function talent_program_service.recover_accidental_empty_draft(db, *, school_group_id, program_id, empty_draft_id, source_framework_id=None, actor=None) that identifies the correct source Framework (defaulting to the accidental empty Draft's own supersedes_framework_version_id, which Start Editing always records regardless of whether cloning ran) and the accidental empty Draft, validates the Draft is genuinely empty (zero FrameworkCompetency rows, zero Assessment history) before touching anything, and re-runs the existing governed create_framework_draft(clone_from_id=...) clone mechanism to produce a new, fully populated, independently editable Draft with every Competency, KPI, Level, descriptor, and ordering already in the source - never reconstructing anything by hand, never modifying the source Framework or historical completed Assessment evidence, and never deleting the accidental empty Draft (left harmless and unreferenced since the recovered Draft's higher version number is what Start Editing/rubric mode selects going forward). (2) A new operator CLI script scripts/recover_talent_accidental_empty_draft.py (dry-run by default, --apply to commit) so whoever has access to the actual production database can run this recovery in one command once pointed at the real Program/Draft ids. (3) The permanent fix: Start Editing's 'Copy the current rubric structure (optional)' checkbox is removed entirely from static/js/talent-program-workspace.js, and the new-version form submission now always sends clone_from_id (framework?.id, naturally omitted via JSON.stringify dropping undefined values for the very first Rubric Structure creation where there is nothing yet to clone) - so a Start Editing action can never again produce an empty Draft. New regression coverage: tests/test_talent_program_start_editing_recovery.py (8 tests, using a synthetic reproduction of the exact incident shape - a source Framework with 9 fully-configured Competencies each carrying its own KPI/two Levels/generic and Grade-specific descriptors, and a simulated accidental empty Draft created exactly as the old UI did with no clone_from_id) proves: the source has all 9 Competencies; the accidental empty Draft is correctly identified via its own supersedes_framework_version_id; recovery restores all 9 Competencies with Grade assignments/labels/ordering preserved into new independent records (disjoint ids, same underlying Competency identities); KPI/Levels/generic+Grade-specific descriptors are all preserved (9 rubrics x 2 levels x 2 descriptor kinds = 36 descriptor rows); the source Framework's revision/fingerprint/member count are provably unchanged and editing the recovered Draft never touches the source; recovery safely refuses to touch a Draft that already has real Competencies or an explicit source that cannot be resolved; and tenant/Program boundaries cannot be crossed. Two new tests in tests/talent_program_workspace.test.cjs prove Start Editing's form now always sends clone_from_id (never offering the removed checkbox) and that the very first Rubric Structure creation for a Program with no Framework yet still correctly omits a meaningless clone_from_id. One pre-existing test assertion ('legacy assessed rubric stays historical...') was updated to reflect the checkbox's removal rather than asserting its prior presence - no behavior change, only fixture-text alignment. Zero new test regressions: the full focused Talent Python suite and tests/talent_program_workspace.test.cjs/tests/talent_operations.test.cjs are confirmed via before/after comparison to have identical pre-existing failure sets."
