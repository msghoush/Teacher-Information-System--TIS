{% extends "saas/base.html" %}
{% block content %}
<header class="page-header">
    <span class="page-eyebrow">TIS Access</span>
    <h1>{{ access_presentation.title }}</h1>
    <p class="page-subtitle">{{ access_presentation.message }}</p>
</header>
<div class="actions">
    {% if access_presentation.action_url %}<a class="btn" href="{{ access_presentation.action_url }}">{{ access_presentation.action_label }}</a>{% endif %}
    <a class="btn secondary" href="mailto:{{ support_email }}">Contact the TIS Team</a>
    <form method="post" action="/saas/auth/logout"><button class="btn secondary" type="submit">Sign Out</button></form>
</div>
{% endblock %}
